function bossChapterIdx(stageIdx){ return Math.floor(stageIdx/CHAPTER_LENGTH); }
function bossWaveNormalPower(stageIdx){ return CHAPTER_ENEMY_END[bossChapterIdx(stageIdx)] * 0.55; } // (v150) 보스 1·2웨이브는 그 챕터 막바지보다 약간 낮게 — 3웨이브 보스에서 진짜 승부를 봄
function bossGimmickFor(stageIdx){ return CHAPTER_BOSS_GIMMICK[bossChapterIdx(stageIdx)]; }
function bossFixedElementFor(stageIdx){ return CHAPTER_BOSS_ELEMENT[bossChapterIdx(stageIdx)]; }
function bossWaveNormalComp(stageIdx, wave){
  const arr = [];
  for(let j=0;j<GRID_SLOTS;j++){ const r = seededRand(stageIdx*911.3 + wave*57.1 + j*13.7 + 3); arr.push(ELEMENTS[Math.floor(r*ELEMENTS.length)]); }
  return arr;
}
function bossWaveNormalRarity(stageIdx, wave){
  const arr = [], progress = Math.min(1, stageIdx/(CHAPTER_LENGTH*MAX_CHAPTERS));
  for(let j=0;j<GRID_SLOTS;j++){
    const rarityRoll = seededRand(stageIdx*733.1+wave*41.3+j*19.1+5), variantRoll = seededRand(stageIdx*733.1+wave*41.3+j*19.1+7);
    arr.push({ rarity: weightedPickSeeded(enemyRarityWeights(progress), rarityRoll), variant: variantRoll<0.5?'a':'b' });
  }
  return arr;
}
function bossWardElements(stageIdx){
  const first = ELEMENTS[Math.floor(seededRand(stageIdx*457.1+1)*ELEMENTS.length)];
  let second = first, t = 0;
  while(second===first && t<10){ second = ELEMENTS[Math.floor(seededRand(stageIdx*457.1+2+t)*ELEMENTS.length)]; t++; }
  return [first, second];
}
// 진형 배치: 5마리를 전열(0~2)·후열(3~5) 중 앞쪽부터 채움(간단화 — 세부 배치는 웨이브 전환 화면에서 조정 가능)
function buildBossWaveFight(stageIdx, wave, active, unitHp){
  // (v152) 보스전은 웨이브 중간 교체를 없애고 3웨이브 내내 같은 6마리로 고정 — 피로 로직 불필요
  const myUnits = [];
  active.forEach((key, idx)=>{
    if(!key) return;
    const u = makeBattleUnit('me', idx, key, unitAtk(key), ALLY_HP_MULT);
    const persisted = unitHp[key];
    if(persisted){ u.maxHp = Math.min(persisted.maxHp, u.maxHp) || u.maxHp; u.hp = Math.max(0, Math.min(persisted.hp, u.maxHp)); u.alive = u.hp>0; }
    myUnits.push(u);
  });
  let enemyUnits, gimmick = null;
  if(wave < BOSS_WAVE_COUNT){
    const els = bossWaveNormalComp(stageIdx, wave), rvs = bossWaveNormalRarity(stageIdx, wave), per = bossWaveNormalPower(stageIdx);
    enemyUnits = els.map((el,idx)=>{ const rv = rvs[idx], key = el+'_'+rv.rarity+'_'+rv.variant; return makeBattleUnit('enemy', idx, key, per*ELEMENT_ATK_MULT[el], ENEMY_HP_MULT); });
  }else{
    const type = bossGimmickFor(stageIdx), fixedEl = bossFixedElementFor(stageIdx);
    const bossEl = fixedEl || ELEMENTS[Math.floor(seededRand(stageIdx*171.3+1)*ELEMENTS.length)];
    const per = bossWaveNormalPower(stageIdx) * BOSS_POWER_MULT;
    const boss = makeBattleUnit('enemy', 4, bossEl+'_legendary_a', per*ELEMENT_ATK_MULT[bossEl], BOSS_HP_MULT);
    boss.isBoss = true; boss.gimmick = type;
    if(type==='ruinGuardian'){
      const [we1, we2] = bossWardElements(stageIdx);
      const w1 = makeBattleUnit('enemy', 1, we1+'_epic_a', per*0.35*ELEMENT_ATK_MULT[we1], ENEMY_HP_MULT*1.4);
      const w2 = makeBattleUnit('enemy', 0, we2+'_epic_a', per*0.35*ELEMENT_ATK_MULT[we2], ENEMY_HP_MULT*1.4);
      w1.isWard = true; w2.isWard = true;
      enemyUnits = [w1, w2, boss];
    }else{
      enemyUnits = [boss];
    }
    gimmick = { type, nextElement: type==='abyssCrystal' ? ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)] : null };
  }
  const sf = { v:150, mode:'boss', stageIdx, wave, round:1, phase:'acting', queue:[], queuePos:0, myUnits, enemyUnits,
    log:['웨이브 '+wave+' 시작!'], result:null, fxSeq:0, lastFx:null, gimmick };
  startRoundQueue(sf);
  return sf;
}
function applyBossGimmick(sf){
  const g = sf.gimmick; if(!g) return;
  const boss = sf.enemyUnits.find(u=>u.isBoss && u.alive);
  if(!boss) return;
  if(g.type==='frostGiant'){
    if(sf.round % 3 === 0){
      const alive = aliveUnits(sf.myUnits);
      if(alive.length){
        const fastest = alive.reduce((x,y)=> effSpeed(y)>effSpeed(x)?y:x);
        fastest.st.freeze = true;
        pushLog(sf, '🧊 서리거인이 '+SPIRITS[fastest.key].name+'을(를) 얼렸다!');
      }
    }
  }else if(g.type==='lavaLord'){
    aliveUnits(sf.myUnits).forEach(u=>{
      u.st.burnCap = Math.max(u.st.burnCap||5, 5);
      u.st.burn = Math.min(u.st.burnCap, (u.st.burn||0)+1);
      u.st.burnDmg = Math.max(u.st.burnDmg||0, Math.round(boss.atk*0.08));
    });
    pushLog(sf, '🌋 용암군주의 화상 장판!');
  }else if(g.type==='ancientTree'){
    if(sf.round % 2 === 0){
      const backAlive = aliveUnits(sf.myUnits).filter(u=>!isFrontRow(u.idx));
      if(backAlive.length){
        const target = backAlive[Math.floor(Math.random()*backAlive.length)];
        const frontIdx = target.idx - 3, occ = unitAt(sf, 'me', frontIdx);
        if(occ) occ.idx = target.idx;
        target.idx = frontIdx;
        pushLog(sf, '🌳 덩굴이 '+SPIRITS[target.key].name+'을(를) 전열로 끌어냈다!');
      }
    }
    const before = boss.hp; boss.hp = Math.min(boss.maxHp, boss.hp + Math.round(boss.maxHp*0.03));
    if(boss.hp>before) pushLog(sf, '🌳 고대수목이 재생했다');
  }else if(g.type==='abyssCrystal'){
    boss.element = g.nextElement; boss.line = boss.element+'_a';
    g.nextElement = ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)];
    pushLog(sf, '🔮 심연의 수정이 '+ELEMENT_INFO[boss.element].name+' 속성으로 변했다!');
  }
}
// 보스 기믹으로 인한 방어측 배율/특수 판정 — dealDamage에서 typeMult 적용 직후 호출
function bossDefenseAdjust(sf, a, d, v){
  if(!d.isBoss || !d.gimmick) return { v, blocked:false, healBoss:0 };
  if(d.gimmick==='frostGiant'){ v *= (a.element==='fire') ? 2 : 0.5; }
  else if(d.gimmick==='lavaLord' && a.element==='fire'){ return { v:0, blocked:false, healBoss: Math.round(v) }; }
  else if(d.gimmick==='ruinGuardian'){ if(sf.enemyUnits.some(u=>u.isWard && u.alive)) return { v:0, blocked:true, healBoss:0 }; }
  return { v, blocked:false, healBoss:0 };
}
function bossWaveGrade(rounds){ if(rounds<=18) return 'S'; if(rounds<=24) return 'A'; if(rounds<=30) return 'B'; return 'C'; }
function resolveBossWaveVictory(sf){
  const bf = state.bossFight, stageIdx = sf.stageIdx, totalRounds = bf.totalRounds||sf.round;
  const grade = bossWaveGrade(totalRounds), already = state.stageBest[stageIdx];
  const gradeRank = {C:1,B:2,A:3,S:4};
  const chapterNum = bossChapter(stageIdx);
  const baseReward = Math.round(20 + stageIdx*1.2);
  state.essence += baseReward;
  let improved = false, equipCount = 0;
  if(!already || gradeRank[grade] > gradeRank[already]){
    improved = true;

      const tier = STAGE_GRADE_ORDER[r-1];
      equipCount += chapterNum; // 챕터가 높을수록 한 번에 주는 장비권도 늘어남(챕터1=1장 ... 챕터5=5장씩)

    }
    state.stageBest[stageIdx] = grade;
  }
  state.dailyStats.stagesCleared += 1;

function checkBossWaveOutcome(sf){
  if(sf.result) return true;

function upcomingOrder(sf, n){

  const shPct = Math.min(100, (u.st.shield||0)/u.maxHp*100);
  const attr = (opts.sel || opts.can) ? ' data-tgt="'+u.side+':'+u.idx+'"' : '';
  const st = u.alive ? statusIcons(u) : '';

    + (opts.cur ? '<div class="bu-marker">▼</div>' : '')
    + '<div class="bu-body"><div class="bu-shadow"></div><div class="bu-icon">'+ELEMENT_INFO[u.element].icon+'</div>'
    + (opts.fx && opts.fx.text ? '<div class="bu-float '+(opts.fx.textCls||'')+'">'+opts.fx.text+'</div>' : '')
    + '</div>'
    + '<div class="bu-plate">'+((u.owner && raidIsNet() && u.owner!==raidNet.role) ? '👥' : '')+(u.dispName || sp.name)+eff+'</div>'
    + '<div class="bu-hp"><div style="width:'+hpPct+'%;"></div>'+(shPct>0?'<i style="width:'+shPct+'%;"></i>':'')+'</div>'
    + '<div class="bu-hpnum">'+fmtHp(u.hp)+'/'+fmtHp(u.maxHp)+(st?' <span class="bu-st">'+st+'</span>':'')+'</div>'
    + '</div>';
}

function showSkillStageScreen(){
  const sf = state.skillFight; if(!sf) return;
  if(document.getElementById('modalRoot').innerHTML) closeModal();
  const firstMount = !document.getElementById('battleScreen');
  const root = mountBattleScreen();
  if(firstMount) window.scrollTo(0, 0);
  const side = sf.result ? 'none' : settleQueue(sf);
  const cur = (side==='me' || side==='enemy') ? sf.queue[sf.queuePos] : null;
  const raidWaiting = sf.mode==='raid' && side==='me' && (!raidMine(cur.idx) || (raidNet.role==='guest' && raidNet.pendingSeq > (sf.actSeq||0)));
  const curUnit = (side==='me' && !raidWaiting) ? unitAt(sf, 'me', cur.idx) : null;
  if(curUnit) ensureSkillSelection(sf, curUnit);
  const fx = (sf.lastFx && sf.lastFx.id !== skillRenderedFx) ? sf.lastFx : null;
  if(fx) skillRenderedFx = fx.id;
  const intro = skillIntroPending; skillIntroPending = false;
  if(intro) skillIntroUntil = Date.now() + 1300;
  // 이번 행동의 연출: 공격자 돌진, 맞은 대상마다 흔들림·숫자
  const fxFor = u=>{
    if(!fx || !fx.hits) return null;
    const out = { cls:'', text:'', textCls:'' };
    if(fx.kind==='act' && fx.actorSide===u.side && fx.actorIdx===u.idx && fx.hits.some(h=>h.kind==='dmg' && h.side!==u.side)) out.cls = u.side==='me' ? 'fx-lunge-up' : 'fx-lunge-down';
    const mine = fx.hits.filter(h=>h.side===u.side && h.idx===u.idx);
    const dmg = mine.filter(h=>h.kind==='dmg').reduce((x,h)=>x+h.amount, 0);
    const heal = mine.filter(h=>h.kind==='heal').reduce((x,h)=>x+h.amount, 0);
    const sh = mine.filter(h=>h.kind==='shield').reduce((x,h)=>x+h.amount, 0);
    const stat = mine.find(h=>h.kind==='status');
    const d0 = mine.find(h=>h.kind==='dmg');
    if(dmg || (d0 && d0.amount===0)){
      const strong = d0 && d0.eff>1, weak = d0 && d0.eff<1, crit = mine.some(h=>h.crit), dot = d0 && d0.dot;
      out.cls += ' fx-hit'+(strong?' fx-strong':'')+(weak?' fx-weak':'');
      out.text = '-'+dmg+(crit?'!':'')+(strong?'<small>유리!</small>':(weak?'<small>불리</small>':(dot?'<small>지속</small>':'')));
      out.textCls = crit ? 'crit' : (strong ? 'strong' : (weak ? 'weak' : ''));
    }else if(heal){ out.cls += ' fx-heal'; out.text = '+'+heal; out.textCls = 'heal'; }
    else if(sh){ out.cls += ' fx-heal'; out.text = '🛡'+sh; out.textCls = 'buff'; }
    else if(stat){ out.cls += ' fx-heal'; out.text = stat.text; out.textCls = 'buff'; }
    return (out.cls || out.text) ? out : null;
  };
  const cellHtml = (s, idx, size)=>{
    const u = unitAt(sf, s, idx);
    if(!u) return '<div class="bu bu-empty"></div>';
    const o = { size, fx: fxFor(u), cur: !!(cur && cur.side===s && cur.idx===idx) };
    if(curUnit && u.alive){
      if(skillTargetable(sf, s, idx)){
        o.sel = skillSel.side===s && skillSel.idx===idx; o.can = !o.sel;
        if(o.sel){ const tm = typeMult(curUnit.element, u.element); o.eff = tm===1 ? 0 : tm; }
      }else o.blocked = true;
    }
    return battleUnitHtml(u, o);
  };
  const row = (cls, tag, s, idxs, size)=> '<div class="bs-row '+cls+'"><span class="bs-rowtag">'+tag+'</span>'+idxs.map(i=>cellHtml(s, i, size)).join('')+'</div>';

  let html = intro ? '<div class="bs-wipe"></div>' : '';
  const titleTxt = sf.mode==='boss' ? '👑 웨이브 '+sf.wave+'/'+BOSS_WAVE_COUNT+' · R'+sf.round

  html += '<div class="bs-top"><button class="bs-exit" id="skillExitBtn">← 나가기</button>'

    + '<button id="skillSpeedBtn" class="bs-exit" style="'+(state.skillSpeed2x?'background:#ffb84d55; border-color:#ffb84d;':'')+'">'+(state.skillSpeed2x?'⏩2x':'▶1x')+'</button>'
    + '<button id="skillAutoBtn" class="bs-exit" style="'+(state.skillAuto?'background:#5cc8ff55; border-color:#5cc8ff;':'')+'">🤖'+(state.skillAuto?'ON':'OFF')+'</button>'
    + '</div></div>';
  if(!sf.result){
    html += '<div class="bs-order"><span class="lbl">행동 순서</span>';
    let sep = false;
    upcomingOrder(sf, 9).forEach((x, k)=>{
      if(x.next && !sep){ html += '<span class="sep"></span>'; sep = true; }
      html += '<span class="oc'+(x.e.side==='enemy'?' en':'')+(k===0 && !x.next?' now':'')+(x.next?' nx':'')+'">'+ELEMENT_INFO[x.u.element].icon+'</span>';
    });

  }
  const anyCrit = fx && fx.hits && fx.hits.some(h=>h.crit);

  html += '<div class="bs-field'+(anyCrit ? ' fx-shake' : '')+'"><div class="bs-snow"></div>'

    + row('r-mf', '전열', 'me', myFront, sf.mode==='raid'?34:42)
    + row('r-mb', '후열', 'me', myBack, sf.mode==='raid'?38:46)

    html += '<div class="bs-wait">전투 종료</div>';

      + '<button class="bs-info" id="skillKitBtn">ⓘ</button></div>';
    const btn = (act, label, icon)=>{
      const sk = unitSkill(curUnit, act), kind = sk ? sk.kind : 'harm';

      const cd = act==='s1' ? curUnit.cd1 : (act==='s2' ? curUnit.cd2 : 0);
      let small;
      if(!ok) small = '재사용 '+cd+'R';
      else{
        const p = skillPreview(sf, curUnit, act, skillSel.side, skillSel.idx);
        const warn = (kind==='harm' && onAlly) ? ' <b class="warn">아군!</b>' : ((kind!=='harm' && !onAlly) ? ' <b class="warn">적!</b>' : '');
        small = p.text + (p.kill && !onAlly ? ' · 처치' : '') + warn;
      }
      return '<button class="btn'+(act==='basic'?' secondary':'')+'" data-act="'+act+'" '+(ok?'':'disabled')+'>'+icon+' '+label+'<small>'+small+'</small></button>';
    };
    const acts = [btn('basic', '기본 공격', '⚔️'), btn('s1', kit.s1.name, kit.s1.icon)];

    html += '<div class="bs-acts n'+acts.length+'">'+acts.join('')+'</div>';
  }else if(side==='enemy'){
    html += '<div class="bs-wait">👹 '+skillUnitName('enemy', unitAt(sf, 'enemy', cur.idx))+' 행동 중…</div>';
  }else if(raidWaiting){
    html += '<div class="bs-wait">'+(raidMine(cur.idx) ? '📨 행동 전송됨 · 반영 대기…' : '👥 '+(raidNet.role==='solo' ? 'AI 동료' : raidNameOf(raidPartnerUid()))+'의 차례 · '+skillUnitName('me', unitAt(sf,'me',cur.idx))+(raidNet.role!=='solo' && raidPartnerGone() ? ' (연결 끊김 · AI 대행)' : '…'))+'</div>';
  }else{
    html += '<div class="bs-wait">라운드 '+(sf.round+1)+' 준비 중…</div>';
  }
  html += '</div>';
  if(sf.result) html += (sf.result.waveClear ? bossWaveClearOverlayHtml(sf) : (sf.mode==='expedition' ? expeditionResultOverlayHtml(sf) : (sf.mode==='raid' ? raidResultOverlayHtml(sf) : skillResultOverlayHtml(sf))));

      if(raidPartnerGone() || !raidNet.roomH){

        raidDissolve(); return;
      }
      toast('레이드 중에는 나갈 수 없어요 (팀원 연결이 끊기면 해산 가능)'); return;
    }

  if(q('skillExitBtn')) q('skillExitBtn').addEventListener('click', leave);
  if(q('skillSpeedBtn')) q('skillSpeedBtn').addEventListener('click', (e)=>{ e.stopPropagation(); state.skillSpeed2x = !state.skillSpeed2x; save(); showSkillStageScreen(); });
  if(q('skillAutoBtn')) q('skillAutoBtn').addEventListener('click', (e)=>{ e.stopPropagation(); state.skillAuto = !state.skillAuto; save(); showSkillStageScreen(); });
  if(q('waveNextBtn')) q('waveNextBtn').addEventListener('click', advanceBossWave);
  if(sf.mode==='boss'){

  }else if(sf.mode==='expedition'){

// (v98) 출전 명단 초안 — 창을 닫았다 열어도(새로고침 포함) 남도록 세이브 상태에 보스별로 저장
function getRosterDraft(stageIdx){
  if(!state.bossRosterDraft) state.bossRosterDraft = {};
  const raw = state.bossRosterDraft[stageIdx] || [];
  const clean = raw.filter((k,i)=> SPIRITS[k] && ownedCount(k)>0 && raw.indexOf(k)===i).slice(0,8); // (v151) 6출전+2대기=8 · 더는 없는 정령은 자동으로 빠짐
  state.bossRosterDraft[stageIdx] = clean;
  return clean;
}
function countersBossHint(key, stageIdx){
  const fixedEl = bossFixedElementFor(stageIdx), el = SPIRITS[key].element;
  if(!fixedEl) return false; // 심연의 수정은 속성이 매 라운드 바뀌어 고정 힌트가 의미 없음

// 내용은 스크립트가 다 초기화된 뒤 검사·정리함(sanitizeState).
function isPlainObj(o){ return !!o && typeof o==='object' && !Array.isArray(o); }
function mergeWithDefaults(def, saved){
  if(!isPlainObj(saved)) return def;
  const out = {};
  Object.keys(def).forEach(k=>{
    const d = def[k], v = saved[k];
    if(v===undefined){ out[k] = d; return; }
    if(d===null){ out[k] = v; return; }
    if(Array.isArray(d)) out[k] = Array.isArray(v) ? v : d;
    else if(typeof d==='number') out[k] = (typeof v==='number' && isFinite(v)) ? v : d;
    else if(typeof d==='string') out[k] = typeof v==='string' ? v : d;
    else if(typeof d==='boolean') out[k] = typeof v==='boolean' ? v : d;
    else if(isPlainObj(d)) out[k] = isPlainObj(v) ? v : d;
    else out[k] = v;
  });
  Object.keys(saved).forEach(k=>{ if(!(k in out)) out[k] = saved[k]; });
  return out;
}
let state = load();
function load(){

    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    const s = mergeWithDefaults(defaultState(), JSON.parse(raw));
    // 날짜 롤오버 체크 (나머지 필드 보정은 mergeWithDefaults + sanitizeState가 담당)
    if(s.dailyStats.date !== todayStr()){
      s.dailyStats = {date: todayStr(), summons:0, fusions:0, stagesCleared:0, equipSummons:0};
    }
    if(s.questsClaimed.date !== todayStr()){
      s.questsClaimed = {date: todayStr(), q1:false, q2:false, q3:false};
    }
    return s;
  }catch(e){ return defaultState(); }
}

}

// ===================== 오디오 (효과음 + 배경음, Web Audio 합성 — 외부 파일 없음) =====================
let audioCtx = null, bgmGain = null, sfxGain = null;
let bgmTimer = null, bgmStep = 0;
// 16스텝 A-B 두 구절 + 베이스 라인(옥타브 아래)로 좀 더 풍성하게
const BGM_MELODY = [392,440,523,440, 523,587,523,440, 349,392,440,392, 440,523,587,523];
const BGM_BASS    = [196,196,262,196, 262,196,262,220, 175,175,220,175, 220,262,294,262];
function resumeAudio(){ try{ const p = audioCtx.resume(); if(p && p.catch) p.catch(()=>{}); }catch(e){} }
function ensureAudioCtx(){
  if(audioCtx && audioCtx.state==='closed'){ audioCtx = null; bgmGain = null; sfxGain = null; } // 닫힌 컨텍스트는 다시 만듦
  // (v106) 예전엔 'suspended'일 때만 resume()을 걸어서, iOS가 앱 전환·화면 잠금 뒤 만드는 'interrupted' 상태에서는
  // 새로고침 전까지 소리가 영영 안 났음 — running이 아니면 무조건 resume 시도
  if(audioCtx){ if(audioCtx.state!=='running') resumeAudio(); return audioCtx; }
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = state.settings.bgmVolume;
    bgmGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = state.settings.sfxVolume;
    sfxGain.connect(audioCtx.destination);
    if(audioCtx.state!=='running') resumeAudio();
  }catch(e){ audioCtx = null; }
  return audioCtx;
}
function playTone(freq, startOffset, duration, bus, type, peak){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type||'sine';
  osc.frequency.value = freq;
  const t0 = audioCtx.currentTime + startOffset;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(peak||0.4, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t0+duration);
  osc.connect(g); g.connect(bus);
  osc.start(t0); osc.stop(t0+duration+0.05);
}
// 효과음 볼륨은 배경음과 체감이 비슷하도록 기존 대비 전반적으로 낮춰둠(peak 값들)
// (v119) 앱을 나갔다 오면 소리가 밀렸다가 한꺼번에 나오던 문제 방지
//  - 화면 밖에서는 소리를 예약하지 않음
//  - 소리 시스템이 멈춰 있을 때 들어온 요청은 가장 최근 것 하나만 기억했다가 재개되면 재생 (여러 개가 쌓여 동시에 터지지 않게)
//  - 재개 대기 중 너무 오래 지난(0.3초+) 요청은 버림
//  - 0.12초 안에 겹쳐 나는 효과음은 3개까지 (등급 연출·승패음은 예외)
const SFX_STALE_MS = 300, SFX_BURST_MS = 120, SFX_BURST_MAX = 3;
const SFX_PRIORITY = ['summonEpic','summonLegend','win','lose'];
let sfxPendingName = null, sfxPendingAt = 0, sfxResumeAt = 0, sfxBurstStart = 0, sfxBurstCount = 0;
function sfx(name){
  if(state.settings.sfxVolume<=0) return;
  if(document.hidden) return;
  const ctx = ensureAudioCtx(); if(!ctx) return;
  if(ctx.state==='running'){ sfxPlay(name); return; }
  sfxPendingName = name; sfxPendingAt = Date.now();
  if(sfxResumeAt && Date.now()-sfxResumeAt < 800) return; // 이미 재개 시도 중 (한 번 멈추면 800ms 뒤엔 다시 시도)
  sfxResumeAt = Date.now();
  const done = ()=>{
    sfxResumeAt = 0;
    const n = sfxPendingName; sfxPendingName = null;
    if(n && ctx.state==='running' && Date.now()-sfxPendingAt < SFX_STALE_MS) sfxPlay(n);
  };
  let p; try{ p = ctx.resume(); }catch(e){}
  if(p && p.then) p.then(done).catch(()=>{ sfxResumeAt = 0; sfxPendingName = null; }); else done();
}
// 애니메이션(CSS)에 맞춰 예약하는 소리: 제때 못 나가면(앱을 나가 있었거나 렉) 버림 — 밀린 타이머가 돌아온 순간 몰아서 실행되는 것 방지
function sfxAt(delayMs, fn){
  const due = Date.now() + delayMs;
  setTimeout(()=>{ if(Date.now()-due > SFX_STALE_MS) return; fn(); }, delayMs);
}
function sfxPlay(name){
  if(!audioCtx || state.settings.sfxVolume<=0) return;
  { const now = Date.now();
    if(now-sfxBurstStart > SFX_BURST_MS){ sfxBurstStart = now; sfxBurstCount = 0; }
    if(++sfxBurstCount > SFX_BURST_MAX && !SFX_PRIORITY.includes(name)) return; }
  if(name==='click') playTone(700,0,0.05,sfxGain,'square',0.06);
  else if(name==='navClick') playTone(560,0,0.05,sfxGain,'square',0.06);
  else if(name==='summon') { playTone(660,0,0.1,sfxGain,'triangle',0.16); playTone(880,0.07,0.14,sfxGain,'triangle',0.16); }
  else if(name==='summonRare') { [523,659,784,1047].forEach((f,i)=>playTone(f,i*0.08,0.18,sfxGain,'triangle',0.18)); }
  else if(name==='summonCharge') { [220,277,330,415,523].forEach((f,i)=>playTone(f,i*0.11,0.16,sfxGain,'sine',0.10)); }
  else if(name==='summonEpic') { [523,659,784,1047,1319].forEach((f,i)=>playTone(f,i*0.07,0.22,sfxGain,'triangle',0.2)); playTone(262,0,0.5,sfxGain,'sine',0.14); }
  else if(name==='summonLegend') { [523,659,784,1047,1319,1568].forEach((f,i)=>playTone(f,i*0.07,0.26,sfxGain,'triangle',0.22)); playTone(196,0,0.7,sfxGain,'sine',0.16); playTone(392,0.1,0.6,sfxGain,'sine',0.12); }
  else if(name==='fuse') { playTone(440,0,0.1,sfxGain,'sawtooth',0.14); playTone(660,0.08,0.12,sfxGain,'sawtooth',0.14); playTone(880,0.16,0.2,sfxGain,'sawtooth',0.16); }
  else if(name==='enhance') { playTone(523,0,0.07,sfxGain,'square',0.12); playTone(784,0.06,0.12,sfxGain,'square',0.14); }
  else if(name==='win') { [523,659,784,1047].forEach((f,i)=>playTone(f,i*0.09,0.2,sfxGain,'square',0.16)); }
  else if(name==='lose') { playTone(300,0,0.3,sfxGain,'sawtooth',0.12); playTone(220,0.15,0.35,sfxGain,'sawtooth',0.12); }
  else if(name==='claim') { playTone(784,0,0.07,sfxGain,'sine',0.15); playTone(1047,0.06,0.1,sfxGain,'sine',0.15); }
  else if(name==='battleStart') { playTone(220,0,0.08,sfxGain,'square',0.11); playTone(330,0.07,0.1,sfxGain,'square',0.11); }
}
function startBgm(){
  if(bgmTimer || !ensureAudioCtx()) return;
  bgmTimer = setInterval(()=>{
    if(state.settings.bgmVolume<=0) return;
    if(document.hidden || !audioCtx || audioCtx.state!=='running') return; // 멈춘 동안 음이 쌓였다가 한꺼번에 터지는 것 방지
    const step = bgmStep % BGM_MELODY.length;
    playTone(BGM_MELODY[step], 0, 0.5, bgmGain, 'sine', 0.09);
    playTone(BGM_BASS[step], 0, 0.6, bgmGain, 'triangle', 0.05);
    // 화음을 5도/3도로 번갈아 살짝 색을 더함(4박마다)
    if(step % 4 === 0){
      const interval = (step % 8 === 0) ? 1.5 : 1.25;
      playTone(BGM_MELODY[step]*interval, 0.02, 0.9, bgmGain, 'sine', 0.035);
    }
    // 루프당 한 번, 아주 은은한 반짝임(고음 트윙클)으로 포인트 하나 추가
    if(step === 14) playTone(BGM_MELODY[step]*2, 0.05, 0.7, bgmGain, 'sine', 0.02);
    bgmStep++;
  }, 480);
}
document.addEventListener('click', function initAudioOnce(){
  ensureAudioCtx();
  // iOS 계열 모바일 브라우저는 resume()만으로 완전히 안 풀리고, 제스처 안에서 실제 소리를 하나
  // 재생해야 그 뒤로 소리가 확실히 나는 경우가 있어서, 거의 안 들리는 짧은 톤을 하나 재생해서 풀어둠
  if(audioCtx && sfxGain){ try{ playTone(440, 0, 0.01, sfxGain, 'sine', 0.0001); }catch(e){} }
  startBgm();
  document.removeEventListener('click', initAudioOnce);
}, {once:true});
// 앱 전환·잠금 뒤 iOS가 오디오를 멈추면, 다음 터치 때 다시 켬 / 화면 복귀 때도 시도
function reviveAudio(){ if(audioCtx && audioCtx.state!=='running') ensureAudioCtx(); }
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev, reviveAudio, {passive:true, capture:true}));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reviveAudio(); });
window.addEventListener('pageshow', reviveAudio);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkDailyRollover(); });
// 거의 모든 버튼에 가벼운 클릭음(중복 방지: 이미 고유 효과음을 내는 액션 버튼 몇 개는 제외)
const SFX_CLICK_EXCLUDE_IDS = ['enhanceBtn'];
document.addEventListener('click', (e)=>{
  const t = e.target.closest('button');
  if(!t || t.disabled) return;
  if(SFX_CLICK_EXCLUDE_IDS.includes(t.id)) return;
  if(t.hasAttribute('data-claim-reward') || t.hasAttribute('data-fuse')) return;
  sfx(t.closest('nav') ? 'navClick' : 'click');
});


// ===================== 유틸 =====================
function layoutToasts(){ let y = 60; document.querySelectorAll('.toast').forEach(t=>{ t.style.top = y+'px'; y += t.offsetHeight + 6; }); }
// 보상 알림은 '이름 보상 획득  ✨+40' 형식(아이콘+숫자만 강조). 다른 곳의 보상 표기(✨+N 🔩+N 🎟️×N)와 같은 모양
function toastReward(rw, title, ms){
  const parts = [rw.essence?'✨+'+rw.essence:'', rw.stone?'🔩+'+rw.stone:'', itemsShort(rw.items)].filter(Boolean);
  toast('<span class="tt">'+(title||'보상 획득')+'</span><span class="tnr">'+parts.map(p=>'<span class="tn">'+p+'</span>').join('')+'</span>', ms||3200, true);
}
function toast(msg, ms, html){
  const el = document.createElement('div');
  el.className = 'toast';
  if(html) el.innerHTML = msg; else el.textContent = msg;
  document.body.appendChild(el);
  const all = document.querySelectorAll('.toast'); if(all.length>5) all[0].remove();
  layoutToasts();
  setTimeout(()=>{ el.remove(); layoutToasts(); }, ms||2200);
}
function weightedPick(list){
  const total = list.reduce((s,x)=>s+x.w,0);
  let r = Math.random()*total;
  for(const item of list){
    if(r < item.w) return item.r;
    r -= item.w;
  }
  return list[list.length-1].r;
}
function ownedCount(key){ return state.owned[key] || 0; }
function pushRecentSummon(key){
  state.recentSummons = state.recentSummons || [];
  state.recentSummons.unshift(key);
  if(state.recentSummons.length > 8) state.recentSummons.length = 8;
}

function isElementComplete(el){
  return RARITY_ORDER.every(r=> VARIANTS.every(v=> state.discovered[el+'_'+r+'_'+v]));
}

// ===================== 소환 레벨 =====================
function summonLevel(){ return Math.floor((state.lifetimeSummons||0)/20)+1; }
const SUMMON_EPIC_RATE = 1;   // 에픽 확률(%) 고정
const SUMMON_RARE_BASE = 10;  // 레어 확률(%) 시작값 (소환 Lv.1)
const SUMMON_RARE_STEP = 0.4; // 레어 확률 레벨당 증가(%p), Lv.16에서 상한 16%
const LEGENDARY_SUMMON_LEVEL = 17; // 이 레벨부터 소환 확률표에 레전더리가 등장
function weightsForLevel(lvl){
  // (v101) 에픽 1% 고정. 레어는 Lv.1 10% → Lv.16 16%까지, 레전더리는 Lv.17부터 조금씩(최대 0.5%). 나머지는 전부 일반
  const shift = Math.min(lvl-1, 15);
  const rare = SUMMON_RARE_BASE + shift*SUMMON_RARE_STEP;
  const legendary = lvl >= LEGENDARY_SUMMON_LEVEL ? Math.min(lvl-(LEGENDARY_SUMMON_LEVEL-1), 20)*0.025 : 0;
  return [
    {r:'common', w:100 - rare - SUMMON_EPIC_RATE - legendary},
    {r:'rare', w:rare},
    {r:'epic', w:SUMMON_EPIC_RATE},
    {r:'legendary', w:legendary}
  ];
}
function summonWeights(){ return weightsForLevel(summonLevel()); }

// ===================== 소환 / 합성 =====================
// ===================== 정령장비 (v104) =====================
// 무기 = 공격에만, 방어구 = 체력에만 정령력 %를 더함. 장비 속성이 정령 속성과 같으면 효과 x1.5. 종(種) 단위 장착(강화와 같은 원칙).
const EQUIP_SLOTS = ['weapon','armor'];
const EQUIP_SLOT_INFO = { weapon:{icon:'⚔️', name:'무기', stat:'공격'}, armor:{icon:'🛡️', name:'방어구', stat:'체력'} };
const EQUIP_BONUS = { common:0.04, rare:0.08, epic:0.15, legendary:0.25, mythic:0.40 };
const EQUIP_MATCH_MULT = 1.5;
const EQUIP_NAMES = {
  weapon:{fire:'화염 검', water:'물결 창', wood:'숲결 활', light:'빛 지팡이', dark:'그림자 낫'},
  armor:{fire:'화염 갑옷', water:'물결 갑옷', wood:'숲결 갑옷', light:'빛 갑옷', dark:'그림자 갑옷'}
};
const EQUIP_SUMMON_COST = 200;
function isEquipUnlocked(){ return chapter1BossCleared(); } // (v106) 정령장비는 챕터 1 보스 격파 시 해금
function equipKey(slot, element, rarity){ return slot+'_'+element+'_'+rarity; }
function equipInfo(key){ const p = key.split('_'); return { key, slot:p[0], element:p[1], rarity:p[2], name:EQUIP_NAMES[p[0]][p[1]], icon:EQUIP_SLOT_INFO[p[0]].icon+ELEMENT_INFO[p[1]].icon }; }
function allEquipKeys(){ const out = []; RARITY_ORDER.forEach(r=>EQUIP_SLOTS.forEach(sl=>ELEMENTS.forEach(e=>out.push(equipKey(sl,e,r))))); return out; }
function equipOwnedCount(key){ return (state.equipOwned && state.equipOwned[key]) || 0; }
function equipUsedCount(key){
  let n = 0; const eq = state.equipped || {};
  Object.keys(eq).forEach(sp=>{ if(ownedCount(sp)>0) EQUIP_SLOTS.forEach(sl=>{ if(eq[sp] && eq[sp][sl]===key) n++; }); });
  return n;
}
function equipFreeCount(key){ return equipOwnedCount(key) - equipUsedCount(key); }
function equippedKey(spKey, slot){ return (state.equipped && state.equipped[spKey] && state.equipped[spKey][slot]) || null; }
function equipEffect(eqKey, spKey){ if(!eqKey || !isEquipUnlocked()) return 0; const i = equipInfo(eqKey); return EQUIP_BONUS[i.rarity] * (SPIRITS[spKey].element===i.element ? EQUIP_MATCH_MULT : 1); }
function weaponMult(spKey){ return 1 + equipEffect(equippedKey(spKey,'weapon'), spKey); }
function armorMult(spKey){ return 1 + equipEffect(equippedKey(spKey,'armor'), spKey); }
function eqPct(v){ const x = Math.round(v*1000)/10; return (x%1===0 ? x.toFixed(0) : x.toFixed(1)); } // 0.225 → '22.5'
function equipEffectText(key){ const i = equipInfo(key), b = EQUIP_BONUS[i.rarity]; return EQUIP_SLOT_INFO[i.slot].stat+' +'+eqPct(b)+'% (속성 일치 +'+eqPct(b*EQUIP_MATCH_MULT)+'%)'; }
function equipItem(spKey, slot, key){ if(!state.equipped[spKey]) state.equipped[spKey] = {}; state.equipped[spKey][slot] = key; save(); render(); }
function unequipItem(spKey, slot){ if(state.equipped[spKey]){ state.equipped[spKey][slot] = null; } save(); render(); }
function cleanupEquipment(){ // 보유하지 않게 된 정령의 장착 정보 정리, 장착 수가 보유 수를 넘으면 초과분 해제
  const eq = state.equipped || {};
  Object.keys(eq).forEach(sp=>{ if(ownedCount(sp)<=0) delete eq[sp]; });
  allEquipKeys().forEach(k=>{ let over = equipUsedCount(k) - equipOwnedCount(k);
    if(over>0) Object.keys(eq).forEach(sp=>EQUIP_SLOTS.forEach(sl=>{ if(over>0 && eq[sp] && eq[sp][sl]===k){ eq[sp][sl] = null; over--; } })); });
}
// 추천 장착: 정령력이 높은 정령부터, 부위별로 남은 장비 중 효과가 가장 큰 것(속성 일치 우선)을 끼움
function autoEquipAll(){
  if(!isEquipUnlocked()) return;
  state.equipped = {};
  const spirits = Object.keys(SPIRITS).filter(k=>ownedCount(k)>0);
  const free = {}; allEquipKeys().forEach(k=>{ free[k] = equipOwnedCount(k); });
  EQUIP_SLOTS.forEach(slot=>{
    const items = allEquipKeys().filter(k=>equipInfo(k).slot===slot && free[k]>0);
    const pairs = [];
    spirits.forEach(sp=>items.forEach(k=>pairs.push({sp, k, v:unitPower(sp)*equipEffect(k,sp)}))); // 정령이 강할수록, 속성이 맞을수록 이득이 큼
    pairs.sort((x,y)=>y.v-x.v);
    const done = {};
    pairs.forEach(pr=>{ if(done[pr.sp] || free[pr.k]<=0) return; done[pr.sp] = true; free[pr.k]--; (state.equipped[pr.sp] = state.equipped[pr.sp] || {})[slot] = pr.k; });
  });
  save();
}
// 장비 소환 (정령 소환과 같은 방식: 소환권이 있으면 소환권, 없으면 정수)
function equipSummonLevel(){ return Math.floor((state.lifetimeEquipSummons||0)/20)+1; }
function equipWeights(){ return weightsForLevel(equipSummonLevel()); }
function multiEquipCost(){ return Math.round(EQUIP_SUMMON_COST * MULTI_SUMMON_COUNT * 0.9); }
function canEquipOnce(){ return ticketCount('equip')>0 || state.essence>=EQUIP_SUMMON_COST; }
function canEquipMulti(){ return ticketCount('equip')>=MULTI_SUMMON_COUNT || state.essence>=multiEquipCost(); }
function equipCostLabel(){ return ticketCount('equip')>0 ? TICKET_INFO.equip.icon+' 1' : '✨ '+EQUIP_SUMMON_COST; }
function multiEquipCostLabel(){ return ticketCount('equip')>=MULTI_SUMMON_COUNT ? TICKET_INFO.equip.icon+' '+MULTI_SUMMON_COUNT : '✨ '+multiEquipCost(); }
function rollEquipKey(rarity){ return equipKey(EQUIP_SLOTS[Math.floor(Math.random()*EQUIP_SLOTS.length)], ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)], rarity); }
function addEquip(key){ const isNew = !state.equipSeen[key]; state.equipOwned[key] = (state.equipOwned[key]||0) + 1; state.equipSeen[key] = true; return isNew; }
function equipResultView(key){
  const i = equipInfo(key);
  return { sp:{element:i.element, rarity:i.rarity, name:i.name, variant:'e'}, custom:{ icon:i.icon, sub:EQUIP_SLOT_INFO[i.slot].name+' · '+elLabel(i.element)+' · '+equipEffectText(key), own:'보유 '+equipOwnedCount(key) } };
}
function equipTileInfo(key){ const i = equipInfo(key); return { rarity:i.rarity, icon:i.icon, name:i.name }; }
const EQUIP_RESULT_OPTS = { canAgain:()=>canEquipOnce(), againLabel:()=>'🛡️ 한 번 더 '+equipCostLabel(), ticketKey:'equip' };
function performEquipSummon(againFn){
  checkDailyRollover();
  const key = rollEquipKey(weightedPick(equipWeights()));
  const isNew = addEquip(key);
  state.lifetimeEquipSummons = (state.lifetimeEquipSummons||0) + 1;
  state.dailyStats.equipSummons = (state.dailyStats.equipSummons||0) + 1;
  checkAchievements();
  save();
  const v = equipResultView(key);
  showResultModal(v.sp, isNew, againFn, Object.assign({custom:v.custom}, EQUIP_RESULT_OPTS));
  render();
}
function doEquipSummon(){
  if(!isEquipUnlocked()){ toast('챕터 1 보스 격파 시 해금'); return; }
  const byTicket = ticketCount('equip') > 0;

}

function applyTowerFormation(f){
  const saved = state.towerFormations && state.towerFormations[f];
  if(!Array.isArray(saved)) return;
  state.formation = Array.from({length:5}, (_,k)=> (typeof saved[k]==='string' && SPIRITS[saved[k]]) ? saved[k] : null);

function saveStageFormation(i){
  if(!state.formation.some(k=>k)) return;
  if(!state.stageFormations) state.stageFormations = {};
  state.stageFormations[i] = state.formation.slice(0, isSkillStage(i) ? GRID_SLOTS : 5);
}
function applyStageFormation(i){
  const saved = state.stageFormations && state.stageFormations[i];
  // (v133) 저장된 진형이 없으면 무조건 빈 슬롯부터 시작 — 직전 전투 진형을 그대로 물려받지 않음
  state.formation = Array.from({length: isSkillStage(i) ? GRID_SLOTS : 5}, (_,k)=> (Array.isArray(saved) && typeof saved[k]==='string' && SPIRITS[saved[k]]) ? saved[k] : null);
  cleanupFormation();
}
function cleanupFormation(){
  const used = {};
  state.formation = state.formation.map(k=>{
    if(!k) return null;
    used[k] = (used[k]||0)+1;
    if(used[k] > ownedCount(k)) return null;
    return k;
  });
  cleanupEquipment();
}

// ===================== 진형 / 상성 대결 =====================
function slotAdvantage(playerKey, enemyEl){
  if(!playerKey) return 'none';
  const m = typeMult(SPIRITS[playerKey].element, enemyEl);
  if(m>1) return 'up';
  if(m<1) return 'down';
  return 'even';
}
// 슬롯별로 각각 반올림하면 합계가 전체 반올림값과 어긋날 수 있어서(±1 오차),
// "최대 나머지법"으로 슬롯 표시값들의 합이 항상 전체 표시값과 정확히 같도록 분배한다.
// decimals=1로 소수점 첫째자리까지 유지해서 반올림 오차 자체를 줄인다.
function distributeRounded(values, decimals){
  // (수정) 예전엔 "슬롯별 표시값 합 = 전체 표시값"을 맞추려고 나머지를 아무 슬롯에나 몰아줬는데,
  // 그러다 보니 완전히 똑같은 값을 가진 슬롯들 중 하나만 반올림이 다르게 튀어서(예: 12.7/12.7/12.8)
  // 오히려 계산이 이상하다는 오해를 샀음. 이제는 그냥 슬롯마다 독립적으로 반올림함 —
  // 합계가 전체 표시값이랑 소수점 단위로 살짝 다를 수 있지만(최대 0.1 정도), 이게 더 이해하기 쉬움
  decimals = decimals===undefined ? 1 : decimals;
  const scale = Math.pow(10, decimals);
  return values.map(v => Math.round(v*scale)/scale);
}
function dmgRound(v){ return Math.round(v*10)/10; } // 전투력/대미지 수치 계산용(1자리 반올림)
function fmtDmg(v){ return v.toFixed(1); } // 화면 표시용 — toFixed로 부동소수점 표시 오차(예: 120.89999999999999) 원천 차단
function gradeFor(ratio){
  if(ratio < 1.0) return null; // 실패 — 상대보다 전투력이 낮으면 통과 자체가 안 됨
  if(ratio < 1.3) return 'C'; // 1이라도 높으면 C 시작
  if(ratio < 1.6) return 'B';
  if(ratio < 2.0) return 'A';
  return 'S'; // 상대 전투력의 200% 이상
}
// 스테이지/보스 보상도 탑과 동일한 단계별 누적-증분 방식: 처음 A로 깨면 C+B+A를 받고,
// 나중에 S로 올리면 이미 받은 C+B+A는 빼고 S분만 추가 지급
const STAGE_GRADE_ORDER = ['C','B','A','S'];
const STAGE_GRADE_WEIGHT = {C:1.0, B:0.3, A:0.3, S:0.6}; // 누적하면 S까지 총 2.2배(기존 S배율과 동일)
function stageTierEssence(base, tier){ return Math.round(base*STAGE_GRADE_WEIGHT[tier]); }
function challengeStage(i){
  saveStageFormation(i);
  challengeNormalStage(i);
}
function grantStageTierRewards(prefix, i, base, grade, already, rewardMultiplier, bonusStoneOnTop, icon, labelPrefix, tab){
  const gradeRank = {C:1,B:2,A:3,S:4};
  const prevRank = already ? gradeRank[already] : 0;
  const newRank = gradeRank[grade];
  let total = 0;
  for(let r=prevRank+1; r<=newRank; r++){
    const tier = STAGE_GRADE_ORDER[r-1];
    const amt = Math.round(stageTierEssence(base, tier)*rewardMultiplier);
    total += amt;
    const stoneHere = (r===newRank) ? bonusStoneOnTop : 0;
    addPendingReward(prefix+'_'+i+'_tier_'+tier, icon, labelPrefix+' '+tier+'등급', amt, stoneHere, tab);
  }
  return total;
}
function challengeNormalStage(i){
  const filled = state.formation.filter(x=>x).length;
  if(filled===0){ toast('진형에 정령 먼저 배치'); return; }
  sfx('battleStart');
  const enemyComp = stageEnemyComposition(i);
  const enemyPerSlot = enemySlotPower(i);
  const special = isSpecialStage(i) ? specialStageSpec(i) : null;
  let playerPower = 0;
  let hasMythicLeader = false;
  let reviveBonus = 0; // 물 속성 재생/불사
  let rewardBonusRate = 0; // 어둠 속성 탐욕
  const slotDetails = [];
  state.formation.forEach((key,idx)=>{
    if(idx>=unlockedSlotCount()) return;
    if(!key){ slotDetails.push(null); return; }
    const sp = SPIRITS[key];
    const passive = passiveFor(key);
    if(sp.rarity==='mythic') hasMythicLeader = true;
    if(passive && passive.reviveBonus) reviveBonus = Math.max(reviveBonus, passive.reviveBonus);
    if(passive && passive.rewardBonus) rewardBonusRate = Math.max(rewardBonusRate, passive.rewardBonus);
    let atk = baseSlotAtk(key, idx, enemyComp, special);
    let crit = false;
    if(passive && passive.crit && Math.random()<passive.crit.chance){ atk *= passive.crit.mult; crit = true; }
    playerPower += atk;
    slotDetails.push({ atk, adv: slotAdvantage(key, enemyComp[idx]), crit });
  });
  const rawPlayerSum = playerPower;
  if(hasMythicLeader) playerPower *= 1.1; // 통솔
  if(special) playerPower *= specialAggregateMultForFormation(special); // 자원형·정예형 포함, 규칙이 둘이면 합산
  let playerPowerDisplay = playerPower;
  if(rawPlayerSum>0){
    const displayFactor = playerPower/rawPlayerSum;
    const scaled = slotDetails.map(d=> d ? d.atk*displayFactor : 0);
    const dist = distributeRounded(scaled);
    slotDetails.forEach((d,idx)=>{ if(d) d.atk = dist[idx]; });
    playerPowerDisplay = dist.reduce((a,b)=>a+b,0);
  }
  let enemyPower = 0;
  const enemyRawAtks = [];
  const enemyRarity = enemyRarityCompForStage(i);
  let enemyHasMythicLeader = false;
  for(let idx=0; idx<unlockedSlotCount(); idx++){
    const rv = enemyRarity[idx];
    const passive = passiveForERV(enemyComp[idx], rv.rarity, rv.variant);
    if(rv.rarity==='mythic') enemyHasMythicLeader = true;
    let v = baseEnemySlotAtk(idx, enemyPerSlot, special, enemyComp[idx], passive);
    if(passive && passive.crit && Math.random()<passive.crit.chance) v *= passive.crit.mult;
    enemyRawAtks.push(v);
    enemyPower += v;
  }
  const rawEnemySum = enemyPower;
  if(enemyHasMythicLeader) enemyPower *= 1.1; // 적도 신화가 있으면 통솔 적용
  if(special) enemyPower *= specialAggregateMultForEnemy(special, enemyComp, unlockedSlotCount());
  const enemySlotAtks = rawEnemySum>0
    ? distributeRounded(enemyRawAtks.map(v=>v*(enemyPower/rawEnemySum)))
    : distributeRounded(enemyRawAtks);
  const enemyPowerDisplay = enemySlotAtks.reduce((a,b)=>a+b,0);
  const ratio = playerPower/enemyPower;
  const grade = gradeFor(ratio);
  // 승패/보상 확정과 저장은 여기서 바로 하지 않고 playBattleAnimation의 연출이 다 끝난 뒤에 처리함
  // (예전엔 버튼 누르자마자 즉시 stageBest/챕터% 보상이 갱신돼서, 전투 연출이 채 끝나기도 전에
  // 챕터 지도 쪽 보상 배지가 먼저 나타나 버리는 문제가 있었음)
  playBattleAnimation(i, playerPowerDisplay, enemyPowerDisplay, grade, slotDetails, enemySlotAtks, rewardBonusRate, reviveBonus, special);
}
function resolveNormalStageBattle(i, grade, rewardBonusRate, reviveBonus, special){
  checkDailyRollover();
  const already = state.stageBest[i];
  const isFirstStageClear = !already;
  let reward = 0;
  let improved = false;
  let baseReward = 0;
  if(grade){
    baseReward = Math.round(5 + i*0.4); // 기본 보상 — 등급 개선 여부와 무관하게 클리어할 때마다 즉시 지급
    state.essence += baseReward;
    const gradeRank = {C:1,B:2,A:3,S:4};
    if(!already || gradeRank[grade] > gradeRank[already]){
      improved = true;
      const base = 50 + i*15;
      reward = grantStageTierRewards('stage', i, base, grade, already, (1+rewardBonusRate), 0, '🗺️', '스테이지 '+(i+1), 'stage');
      state.stageBest[i] = grade;
    }
    if(special && !state.specialStageBonusClaimed[i]){
      state.specialStageBonusClaimed[i] = true;
      addPendingReward('stage_'+i+'_special_bonus', '🌀', '스테이지 '+(i+1)+' 특수 스테이지 보너스', 30+i*3, 8, 'stage');
    }
    state.dailyStats.stagesCleared += 1;
    checkChapterPctRewards(Math.floor(i/CHAPTER_LENGTH)+1);
    checkAchievements();
    save();
  }else if(reviveBonus>0){
    addPendingReward('stage_'+i+'_revive_'+Date.now(), '💧', '재생/불사 위로 보상', reviveBonus, 0, 'stage');
    save();
    toastReward({essence:reviveBonus}, '💧 재생/불사 위로 보상');
  }
  return { reward, improved, isFirstStageClear, baseReward };
}

  const q = QUESTS.find(x=>x.id===id);
  if(!q) return;
  if(state.questsClaimed[id]) return;
  if(!q.check()){ toast('조건 미달성'); return; }
  state.essence += q.reward;
  state.questsClaimed[id] = true;
  save();
  toastReward({essence:q.reward}, '📋 의뢰 보상 획득');
  render();
}

// ===================== 세이브 내보내기/불러오기 =====================
// 이 게임은 브라우저 localStorage에만 저장돼서 기기(폰↔PC) 간 자동 연동이 안 되고,
// 파일을 새로 받을 때마다 브라우저가 다른 출처로 취급해서 저장이 안 이어지는 경우도 있음.
// 그래서 상태 전체를 문자열 코드로 내보내고/불러올 수 있게 해서, 수동으로라도 백업·이전이 가능하게 함.
// LZString으로 압축해서 예전 base64 방식보다 60%가량 짧게 만듦. CDN이 막혀서 LZString이 없으면(오프라인 등)
// base64로 자동 대체 — 코드 앞에 붙는 접두어(LZ:/B64:)로 어떤 방식인지 구분해서 불러오기 때도 맞게 해석함
function encodeSaveString(){
  const json = JSON.stringify(state);
  if(typeof LZString!=='undefined') return 'LZ:'+LZString.compressToEncodedURIComponent(json);
  return 'B64:'+btoa(unescape(encodeURIComponent(json)));
}
// (v130) 붙여넣기 정리: 안 보이는 문자 제거, "LZ:"/"B64:"부터 코드로 인식(앞에 설명글이 붙어도 됨), 줄바꿈·공백 처리
function saveCodeCandidates(raw){
  let t = String(raw==null?'':raw).replace(/[\u200B-\u200D\u2060\uFEFF\u00A0]/g, '');
  // 앞머리는 대소문자·전각 콜론을 가리지 않고 인식(키보드 자동 변환으로 "lz:"처럼 바뀐 경우) → 항상 "LZ:" / "B64:"로 정규화
  const m = t.match(/(LZ|B64)\s*[:：]/i);
  if(m) t = m[1].toUpperCase() + ':' + t.slice(m.index + m[0].length);
  if(/%[0-9A-Fa-f]{2}/.test(t)){ try{ t = decodeURIComponent(t); }catch(e){} }
  const out = [];
  // 1) 공백은 '+'가 바뀐 것일 수 있음(LZString 방식), 줄바꿈·탭만 제거  2) 공백까지 전부 제거(줄 끝 공백이 끼는 경우)
  out.push(t.replace(/ /g, '+').replace(/[\r\n\t]+/g, ''));
  out.push(t.replace(/\s+/g, ''));
  return out.filter((v,i,a)=>v && a.indexOf(v)===i);
}
function decodeSaveOne(s){
  let json = null;
  if(s.startsWith('LZ:')){
    json = LZString.decompressFromEncodedURIComponent(s.slice(3));
    if(!json){ const e = new Error('truncated'); e.code = 'TRUNCATED'; throw e; }
  }else if(s.startsWith('B64:')){
    json = decodeURIComponent(escape(atob(s.slice(4))));
  }else{
    // 접두어 없는 예전 코드(순수 base64) 호환 — 접두어를 빠뜨린 LZ 코드도 한 번 시도
    try{ json = decodeURIComponent(escape(atob(s))); }
    catch(e){ json = LZString.decompressFromEncodedURIComponent(s); }
    if(!json){ const e = new Error('format'); e.code = 'FORMAT'; throw e; }
  }
  return JSON.parse(json);
}
function decodeSaveString(str){
  const cands = saveCodeCandidates(str);
  if(!cands.length){ const e = new Error('empty'); e.code = 'EMPTY'; throw e; }
  let lastErr = null;
  for(const c of cands){
    try{ return decodeSaveOne(c); }catch(e){ lastErr = e; }
  }
  if(lastErr && !lastErr.code) lastErr.code = 'CORRUPT';
  throw lastErr;
}

function unlockedSlotCount(){
  let n=3;
  // (v90) 예전엔 "스테이지 N회 클리어 OR 계정 레벨"이라, 도감 발견 등으로 계정 레벨만 올려도
  // 실제 스테이지 진행과 무관하게 슬롯이 먼저 열릴 수 있었음(설계 요약에 남아있던 재검토 대상 버그).
  // 이제는 챕터1 지도에서 해당 줄(행)까지 실제로 도달해서 그 줄의 스테이지를 하나라도 깨야만 열림
  // (v148) 챕터 10스테이지로 줄면서 줄(행) 기준 스테이지 번호도 같이 줄어듦 — 로직은 동일, 기준 스테이지 번호만 축소
  const ch1Grid = chapterDef(1).grid;
  const rowCleared = (rowIdx)=> Object.keys(ch1Grid).some(k=>{
    const idx = parseInt(k);
    if(idx===CHAPTER_LENGTH-1) return false; // 보스 좌표는 지도 실루엣마다 달라서 줄 판정에서 제외
    return ch1Grid[idx][0]===rowIdx && state.stageBest[idx];
  });
  if(rowCleared(2)) n=4;
  if(rowCleared(3)) n=5;
  return n;
}

function currentChapterNum(){
  let ch = 1;
  while(state.stageBest[ch*CHAPTER_LENGTH-1]) ch++;
  return ch;
}
// ===================== 챕터 % 클리어 보상 =====================
const CHAPTER_PCT_THRESHOLDS = [0.25, 0.5, 0.75, 1.0];
function chapterClearCount(chapterNum){
  const offset = (chapterNum-1)*CHAPTER_LENGTH;
  let count = 0;
  for(let i=0;i<CHAPTER_LENGTH;i++){ if(state.stageBest[offset+i]) count++; }
  return count;
}
// (v103) 챕터 진행도 보상: 25% 정수 / 50% 정령 소환권 5장 / 75% 정수+강화석 / 100% 레어 정령 확정권+소환권 (챕터가 올라갈수록 정수·강화석 증가)
function chapterPctReward(chapterNum, t){
  const p = Math.round(t*100), sc = 1 + (chapterNum-1)*0.5;
  if(p===25) return { essence: Math.round(100*sc), stone: 0, items: null };
  if(p===50) return { essence: 0, stone: Math.round(10*sc), items: {summon:5} };
  if(p===75) return { essence: Math.round(200*sc), stone: Math.round(15*sc), items: null };
  return { essence: 0, stone: Math.round(20*sc), items: {rare:1, summon:5} };
}
function checkChapterPctRewards(chapterNum){
  const count = chapterClearCount(chapterNum);
  const pct = count/CHAPTER_LENGTH;
  CHAPTER_PCT_THRESHOLDS.forEach(t=>{
    if(pct>=t){
      const id = 'ch'+chapterNum+'_pct'+Math.round(t*100);
      if(!state.chapterRewardsClaimed[id]){
        state.chapterRewardsClaimed[id] = true;
        const rw = chapterPctReward(chapterNum, t);
        addPendingReward(id, '🗺️', '챕터'+chapterNum+' '+Math.round(t*100)+'% 클리어', rw.essence, rw.stone, 'stage', rw.items);
        toast('🗺️ 챕터'+chapterNum+' '+Math.round(t*100)+'% 달성 · 보상 대기', 2800);
      }
    }
  });
}

  const count = chapterClearCount(chapterNum);
  const pct = count/CHAPTER_LENGTH;
  let html = '';
  CHAPTER_PCT_THRESHOLDS.forEach(t=>{
    const id = 'ch'+chapterNum+'_pct'+Math.round(t*100);

const ACCOUNT_LEVEL_THRESHOLDS = [0, 10, 30, 60, 100]; // 이 점수를 넘으면 레벨 1~5
const ACCOUNT_UNLOCK_LEVEL = { reroll: 2, expedition: 2 }; // 계정 점수 10 → Lv.2, 30 → Lv.3 (챕터1 보스 클리어 즈음)
const CHAPTER1_BOSS_STAGE = CHAPTER_LENGTH-1; // 챕터1 보스는 스테이지 10(인덱스 9) — (v148) 챕터 10스테이지로 축소
function chapter1BossCleared(){ return !!state.stageBest[CHAPTER1_BOSS_STAGE]; }
function accountPoints(){
  // 시작 시 스타터 5종(속성별 1개)이 이미 discovered 상태라 dexFound가 5부터 시작함.
  // 그대로 점수에 넣으면 새 게임 시작부터 계정 레벨 경험치 바가 절반(5/10) 차있는 버그가 생기므로
  // 스타터 개수만큼 빼고 "직접 발견한" 종만 점수로 인정한다.
  const dexFound = Math.max(0, Object.keys(state.discovered||{}).filter(k=>state.discovered[k]).length - ELEMENTS.length);
  return totalStagesCleared()*1 + (state.towerBest||0)*2 + Math.min(state.expeditionBestReach||0, EXPEDITION_NODE_COUNT)*3 + dexFound*1;
}
function accountLevel(){
  const pts = accountPoints();

  for(let i=1;i<ACCOUNT_LEVEL_THRESHOLDS.length;i++){ if(pts>=ACCOUNT_LEVEL_THRESHOLDS[i]) lvl = i+1; }
  return lvl;
}
function nextAccountThreshold(){
  const lvl = accountLevel();
  return ACCOUNT_LEVEL_THRESHOLDS[lvl] !== undefined ? ACCOUNT_LEVEL_THRESHOLDS[lvl] : null; // null이면 최고 레벨
}
function isUnlocked(feature){

  if(need===undefined) return true;
  return accountLevel() >= need;
}

function hearthSparks(){
  const elapsed = Date.now() - (state.hearth ? state.hearth.lastCollect : Date.now());
  return Math.max(0, Math.min(HEARTH_MAX(), Math.floor(elapsed/HEARTH_INTERVAL_MS())));
}
function hearthNextSparkMs(){
  const elapsed = Date.now() - (state.hearth ? state.hearth.lastCollect : Date.now());
  const sparks = hearthSparks();
  if(sparks>=HEARTH_MAX()) return 0;
  return HEARTH_INTERVAL_MS() - (elapsed % HEARTH_INTERVAL_MS());
}
function collectHearth(){
  const sparks = hearthSparks();
  if(sparks<=0){ toast('모인 불씨 없음'); return; }
  const stoneGain = sparks*HEARTH_STONE_PER_SPARK();
  const essenceGain = sparks*HEARTH_ESSENCE_PER_SPARK();
  state.enhanceStone = (state.enhanceStone||0) + stoneGain;
  state.essence += essenceGain;
  // (v118) 거둬도 다음 불씨까지 진행 중이던 시간은 유지 — 거둔 개수만큼만 시각을 앞으로 당김.
  // 가득 차 있었다면 그동안은 쌓이지 않았으니 지금부터 새로 시작
  const wasFull = sparks >= HEARTH_MAX();
  state.hearth.lastCollect = wasFull ? Date.now() : state.hearth.lastCollect + sparks*HEARTH_INTERVAL_MS();
  save();
  sfx('claim');
  toastReward({essence:essenceGain, stone:stoneGain}, '🔥 화로 수확');
  render();
}
function renderHearthTab(){
  const sparks = hearthSparks();
  const max = HEARTH_MAX();
  let html = '';
  html += '<div style="position:relative; border-radius:20px; padding:24px 16px; text-align:center; background:radial-gradient(circle at 50% 20%, #4a2a1a 0%, #14141c 78%); border:1px solid #ffffff14; overflow:hidden;">';
  html += '<div style="font-size:48px;">🔥</div>';
  html += '<div style="font-size:24px; font-weight:900; margin-top:4px;">'+sparks+'/'+max+'</div>';
  html += '<div class="sub" style="margin-top:2px;">'+(sparks<max?('다음 불씨까지 '+Math.ceil(hearthNextSparkMs()/60000)+'분'):'가득 참')+'</div>';
  html += '<div style="height:8px; border-radius:4px; background:#2a2a38; overflow:hidden; margin-top:10px;"><div style="height:100%; width:'+(sparks/max*100)+'%; background:linear-gradient(90deg,#ff6b4a,#ffb92a);"></div></div>';
  html += '<button class="btn" id="collectHearthBtn" style="margin-top:14px;" '+(sparks<=0?'disabled':'')+'>거두기</button>';
  html += '<div style="display:flex; justify-content:center; gap:14px; margin-top:8px; font-size:13px; font-weight:700;"><span>✨ +'+(sparks*HEARTH_ESSENCE_PER_SPARK())+'</span><span>🔩 +'+(sparks*HEARTH_STONE_PER_SPARK())+'</span></div>';
  html += '</div>';
  html += '<div style="display:flex; justify-content:center; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:var(--sub);">🔥 1 = ✨'+HEARTH_ESSENCE_PER_SPARK()+' + 🔩'+HEARTH_STONE_PER_SPARK()+'</div>';

  html += '<h2 style="margin-top:16px;">업그레이드</h2>';
  Object.keys(HEARTH_UPGRADES).forEach(key=>{
    const u = HEARTH_UPGRADES[key];
    const lvl = hearthUpgradeLevel(key);
    const maxed = lvl>=u.maxLv;
    const cost = hearthUpgradeCost(key);
    const canAfford = !maxed && state.essence>=cost.essence && (state.enhanceStone||0)>=cost.stone;
    let effectText;
    if(key==='output') effectText = '현재 +'+Math.round(lvl*15)+'% → 다음 +'+Math.round((lvl+1)*15)+'%';
    else if(key==='capacity') effectText = '현재 '+(12+lvl*2)+' → 다음 '+(12+(lvl+1)*2);
    else effectText = '현재 '+(20-lvl)+'분 → 다음 '+(20-(lvl+1))+'분';
    html += '<div class="card">';
    html += '<div style="display:flex; align-items:center; justify-content:space-between;">';
    html += '<div><div style="font-weight:700;">'+u.icon+' '+u.name+' Lv.'+lvl+(maxed?' (최고)':'')+'</div><div class="sub">'+u.desc+'</div>'+(!maxed?('<div class="sub" style="margin-top:2px; color:#ffd24a;">'+effectText+'</div>'):'')+'</div>';
    if(!maxed) html += '<button class="btn small" data-hearth-upgrade="'+key+'" '+(canAfford?'':'disabled')+'>업그레이드</button>';
    html += '</div>';
    if(!maxed){
      const eOk = state.essence>=cost.essence;
      const sOk = (state.enhanceStone||0)>=cost.stone;
      html += '<div style="display:flex; gap:12px; margin-top:8px; padding-top:8px; border-top:1px solid #ffffff10;">';
      html += '<div style="font-size:12px; font-weight:700; color:'+(eOk?'var(--sub)':'#ff6b6b')+';">✨ '+cost.essence+'</div>';
      html += '<div style="font-size:12px; font-weight:700; color:'+(sOk?'var(--sub)':'#ff6b6b')+';">🔩 '+cost.stone+'</div>';
      html += '</div>';
    }
    html += '</div>';
  });
  return html;
}
// ===================== 무한의 탑 =====================
// 챕터와 별개로 끝없이 올라가는 도전 — 반복 클리어가 아니라 매번 처음 보는 난이도를 마주치게 됨. 최고 층수/최고 전투력을 기록
function towerFloor(){ return (state.towerBest||0)+1; }
function towerSlotCount(floor){ return floor<=10 ? 3 : (floor<=20 ? 4 : 5); } // (v154) 1~10층 3칸·11~20층 4칸·21층~ 5칸
// (v154) 층마다 특수 규칙 하나씩(1층은 완만한 도입부라 제외). 기존 스테이지 특수 규칙 10종을 그대로 재사용
function isTowerSpecialFloor(floor){ return floor>=2; }
function towerFloorSpec(floor){
  if(!isTowerSpecialFloor(floor)) return null;
  const type = SPECIAL_STAGE_TYPES[Math.floor(seededRand(floor*997.3+13)*SPECIAL_STAGE_TYPES.length)];
  return makeSpecialRule(type, floor, 0, 500, towerSlotCount(floor)); // salt 500으로 스테이지 시드와 겹치지 않게
}
function towerSlotPower(floor){ return Math.round(20*Math.pow(1.055, floor-1)); }
function towerEnemyComposition(floor){
  const arr=[];
  for(let j=0;j<5;j++){ const r=seededRand(floor*61.9+j*7.3+11); arr.push(ELEMENTS[Math.floor(r*ELEMENTS.length)]); }
  return arr;
}
// 탑은 등급 없이 순수 통과/실패(C 이상=통과, 즉 전투력이 상대보다 1이라도 높으면 됨) — 층당 첫 클리어에만 고정 보상 1회 지급
let viewingTowerFloor = null;
function challengeTower(floor){
  const filled = state.formation.filter(x=>x).length;
  if(filled===0){ toast('진형에 정령 먼저 배치'); return; }
  saveTowerFormation(floor); // (v124) 층마다 마지막으로 쓴 진형을 기억
  sfx('battleStart');
  const enemyComp = towerEnemyComposition(floor);
  const slots = towerSlotCount(floor);
  const special = towerFloorSpec(floor);
  let playerPower = 0;
  let hasMythicLeader = false;
  const slotDetails = [];
  state.formation.forEach((key,idx)=>{
    if(idx>=slots) return;
    if(!key){ slotDetails.push(null); return; }
    const sp = SPIRITS[key];
    const passive = passiveFor(key);
    if(sp.rarity==='mythic') hasMythicLeader = true;
    let atk = baseSlotAtk(key, idx, enemyComp, special);
    let crit = false;
    if(passive && passive.crit && Math.random()<passive.crit.chance){ atk *= passive.crit.mult; crit = true; }
    playerPower += atk;
    slotDetails.push({ atk, adv: slotAdvantage(key, enemyComp[idx]), crit });
  });
  const rawPlayerSum = playerPower;
  if(hasMythicLeader) playerPower *= 1.1;
  if(special) playerPower *= specialAggregateMultForFormation(special, slots);
  let playerPowerDisplay = playerPower;
  if(rawPlayerSum>0){
    const displayFactor = playerPower/rawPlayerSum;
    const dist = distributeRounded(slotDetails.map(d=> d ? d.atk*displayFactor : 0));
    slotDetails.forEach((d,idx)=>{ if(d) d.atk = dist[idx]; });
    playerPowerDisplay = dist.reduce((a,b)=>a+b,0);
  }
  const enemyRarity = enemyRarityCompForTower(floor);
  let enemyHasMythicLeader = false;
  const enemyRawAtks = enemyComp.slice(0,slots).map((el,idx)=>{
    const rv = enemyRarity[idx];
    if(rv.rarity==='mythic') enemyHasMythicLeader = true;
    const passive = passiveForERV(el, rv.rarity, rv.variant);
    let v = baseEnemySlotAtk(idx, towerSlotPower(floor), special, el, passive);
    if(passive && passive.crit && Math.random()<passive.crit.chance) v *= passive.crit.mult;
    return v;
  });
  const rawEnemySum = enemyRawAtks.reduce((a,b)=>a+b,0);
  let enemyPower = rawEnemySum * (enemyHasMythicLeader?1.1:1);
  if(special) enemyPower *= specialAggregateMultForEnemy(special, enemyComp, slots);
  const enemySlotAtks = rawEnemySum>0 ? distributeRounded(enemyRawAtks.map(v=>v*(enemyPower/rawEnemySum))) : distributeRounded(enemyRawAtks);
  const enemyPowerDisplay = enemySlotAtks.reduce((a,b)=>a+b,0);
  const ratio = playerPower/enemyPower;
  const grade = gradeFor(ratio); // 통과 조건: C 이상(=전투력이 상대보다 높기만 하면 됨). 등급 자체는 기록용일 뿐 보상과는 무관
  playTowerBattleAnimation(floor, playerPowerDisplay, enemyPowerDisplay, grade, slotDetails, enemySlotAtks, enemyComp);
}
// (v155) 경제 구조: 스테이지=정수, 탑=강화석+층 소환권, 보스=장비권, 출정=장비·재료(강화석) — 층 보상은 정수 대신 강화석이 기본
function towerFloorReward(f){
  if(f%25===0) return {items:{epic:1}};   // 25, 50, 75… 에픽 확정권
  const m = f%10;
  if(m===0) return {items:{rare:1}};      // 10, 20, 30… 레어 확정권
  if(m===5) return {items:{summon:1}};    // 5, 15, 35… 정령 소환권
  if(m===9) return {items:{equip:1}};     // 9, 19, 29… 정령장비 소환권
  if(m===2 || m===4 || m===7) return {stone: 14+4*f};  // 예전엔 정수 소량 곁들였지만 이제 전부 강화석
  return {stone: 24+6*f};                 // 나머지 층: 강화석이 탑의 기본 보상
}
function resolveTowerBattle(floor, playerPower, grade){
  if(playerPower > (state.towerBestPower||0)) state.towerBestPower = dmgRound(playerPower);
  let reward = 0, stoneReward = 0, firstClear = false;
  let frontierAdvanced = false;
  if(grade){
    if(floor === towerFloor()){ state.towerBest = floor; frontierAdvanced = true; } // 프론티어 층을 처음 통과하면 다음 층으로 진행
    if(!state.towerFloorGrades) state.towerFloorGrades = {};
    const gradeRank = {C:1,B:2,A:3,S:4};
    const prevGrade = state.towerFloorGrades[floor];
    if(!prevGrade || gradeRank[grade] > gradeRank[prevGrade]) state.towerFloorGrades[floor] = grade; // 최고 등급 기록(보상과 무관, 순수 기록용)
    if(!state.towerFloorRewardClaimed) state.towerFloorRewardClaimed = {};
    if(!state.towerFloorRewardClaimed[floor]){
      firstClear = true;
      const rw = towerFloorReward(floor);
      reward = rw.essence || 0;
      stoneReward = rw.stone || 0;
      state.towerFloorRewardClaimed[floor] = true;
      addPendingReward('tower_'+floor, '🗼', floor+'층 돌파', reward, stoneReward, 'tower', rw.items || null);
      checkAchievements();
    }
  }
  save();
  return { reward, stoneReward, firstClear, frontierAdvanced };
}
function playTowerBattleAnimation(floor, playerPower, enemyPower, grade, slotDetails, enemySlotAtks, enemyComp){
  const pRatio = playerPower/(playerPower+enemyPower);
  const slots = unlockedSlotCount();
  const pairs = [];
  for(let idx=0; idx<slots; idx++){
    const key = state.formation[idx];
    const pIcon = key ? ELEMENT_INFO[SPIRITS[key].element].icon : null;
    const d = slotDetails[idx];
    pairs.push({p:pIcon, e:ELEMENT_INFO[enemyComp[idx]].icon, dmg: d?d.atk:0, edmg: enemySlotAtks[idx]||0, adv: d?d.adv:'none', crit: d?d.crit:false});
  }
  const clash = buildClashSequence(pairs);
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-bg wide" id="modalBg"><div class="modal battle-modal wide" style="text-align:center; position:relative;">'
    + '<h3>🗼 무한의 탑 - '+floor+'층</h3>'
    + clash.html
    + '<div class="row" style="margin:8px 0 4px; font-size:13px;"><div style="flex:1;">아군</div><div style="flex:1; text-align:right;">탑</div></div>'
    + '<div style="display:flex; height:28px; border-radius:14px; overflow:hidden; background:#333;">'
    + '<div id="pBar" style="height:100%; background:linear-gradient(135deg,#5b6bff,#8a5bff); width:50%; transition:width 1.1s cubic-bezier(.2,.8,.3,1);"></div>'
    + '<div id="eBar" style="height:100%; background:#ff4a4a; width:50%; transition:width 1.1s cubic-bezier(.2,.8,.3,1);"></div>'
    + '</div>'
    + '<div id="powerCompare" class="sub" style="margin-top:6px; opacity:0; transition:opacity .4s;">⚔️ '+fmtDmg(playerPower)+' vs '+fmtDmg(enemyPower)+' 🗼</div>'
    + '<div id="battleResult" style="margin-top:14px; min-height:'+(grade ? 166 + ((state.towerFloorRewardClaimed && state.towerFloorRewardClaimed[floor]) ? 0 : 25) + (floor===towerFloor() ? 14 : 0) : 162)+'px;">'+'<div data-placeholder style="min-height:inherit; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub); animation:pulseDim 1.6s ease-in-out infinite;">⚔️ 결과 계산 중…</div>'+'</div>'
    + '</div></div>';
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      { const pb = document.getElementById('pBar'); if(pb) pb.style.width = (pRatio*100)+'%'; }
      { const eb = document.getElementById('eBar'); if(eb) eb.style.width = ((1-pRatio)*100)+'%'; }
      setTimeout(()=>{ const pc=document.getElementById('powerCompare'); if(pc) pc.style.opacity=1; }, 1100);
    }, clash.totalMs);
  });
  setTimeout(()=>{
    const outcome = resolveTowerBattle(floor, playerPower, grade);
    const box = document.getElementById('battleResult');
    if(!box) return; // 결과 화면이 이미 사라졌으면 화면 갱신만 건너뜀 (승패·보상 처리는 위에서 끝남)
    sfx(grade ? 'win' : 'lose');
    if(!grade){
      box.innerHTML = '<div style="font-size:36px;">💥</div><h3>'+floor+'층에서 막힘</h3><div class="sub">전투력이 탑보다 높아야 돌파. 진형 강화 후 재도전</div>'
        + '<button class="btn sticky-ok" id="modalClose" style="margin-top:10px;">확인</button>';
    }else{
      const rewardLine = outcome.firstClear ? '' : '<div class="sub">이미 첫 돌파 보상을 받은 층 (기록 갱신용 재도전)</div>';
      const xpLine = outcome.frontierAdvanced ? '<div class="sub" style="color:#c9a8ff;">+2xp</div>' : '';
      box.innerHTML = '<div style="font-size:36px;">🌟</div><h3>'+floor+'층 돌파! ('+grade+'등급)</h3>'
        + rewardLine
        + xpLine
        + '<div class="sub" style="margin-top:4px;">다음: '+(floor+1)+'층</div>'
        + '<button class="btn sticky-ok" id="modalClose" style="margin-top:10px;">확인</button>';
    }
    document.getElementById('modalClose').addEventListener('click', ()=>{
      closeModal(); render();
    });
  }, clash.totalMs + 1300);
}
// ===================== 출정 (로그라이크 런) =====================
// 매번 새로 생성되는 경로 — 전투/사건/보스 노드가 섞여 있고, 한 번 지면 그 런은 끝. 정령 소유권은 그대로 두고 "이번 런 한정" 버프만 초기화됨
const EXPEDITION_NODE_COUNT = 7; // 한 사이클 = 7단계, 마지막 1개는 항상 보스
const EXPEDITION_EVENT_CHANCE = 0.35;
const EXPEDITION_GROWTH = 1.08;    // (v124) 첫 사이클(1~7단계): 단계마다 적 강도 배율 — 챕터1 보스급에서 완만하게 시작
const EXPEDITION_GROWTH_LATE = 1.15; // (v124) 킵해서 넘어간 사이클부터: 단계마다 더 가파르게 (버프가 쌓여도 끝없이 가지 못하게)
const EXPEDITION_KEEP_STEP = 0.25; // (v124) 킵할 때마다 완주 보상 수령 배율 +
function expeditionCycleReward(){ return { essence: 0, stone: 40 + EXPEDITION_NODE_COUNT*8, equip: 2 }; } // (v155) 출정 완주 보상 = 강화석(재료) + 장비 소환권
function expeditionBaseSlotPower(){ return bossTurnBasePower(CHAPTER1_BOSS_STAGE, 1); } // 시작 난이도 = 챕터1 보스 슬롯값
function expeditionSlotPower(stepIndex){
  const early = Math.min(stepIndex, EXPEDITION_NODE_COUNT), late = Math.max(0, stepIndex-EXPEDITION_NODE_COUNT);
  return Math.round(expeditionBaseSlotPower()*Math.pow(EXPEDITION_GROWTH, early)*Math.pow(EXPEDITION_GROWTH_LATE, late));
}
function expeditionStepIndex(run){ return ((run.cycle||1)-1)*EXPEDITION_NODE_COUNT + run.currentIndex; } // 런 전체에서 몇 번째 단계인지(0부터)
function expeditionKeepMult(run){ return 1 + EXPEDITION_KEEP_STEP*(run.keeps||0); }
function generateExpeditionNodes(startIndex){
  const base = startIndex||0, nodes = [];
  for(let i=0; i<EXPEDITION_NODE_COUNT-1; i++){
    nodes.push({ type: Math.random()<EXPEDITION_EVENT_CHANCE ? 'event' : 'battle', enemyComp: expeditionEnemyComposition(), enemyRarity: expeditionEnemyRarity(base+i) });
  }
  nodes.push({ type:'boss', enemyComp: expeditionEnemyComposition(), enemyRarity: expeditionEnemyRarity(base+EXPEDITION_NODE_COUNT-1) });
  return nodes;
}
function expeditionEnemyComposition(){
  return Array.from({length:GRID_SLOTS}, ()=>ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)]); // (v153) 6칸 새 전투
}
// 출정은 런마다 매번 새로 노드가 생성돼서(seededRand 아닌 순수 Math.random) 스테이지/탑이랑 다르게
// 등급도 노드 생성 시점에 한 번 굴려서 노드 객체에 그대로 저장해둠(같은 런 안에서는 계속 똑같이 유지)
function expeditionEnemyRarity(stepIndex){
  const weights = enemyRarityWeights(Math.min(1, stepIndex/(EXPEDITION_NODE_COUNT*2)));
  return Array.from({length:GRID_SLOTS}, ()=>({
    rarity: weightedPickSeeded(weights, Math.random()),
    variant: Math.random()<0.5 ? 'a' : 'b'
  }));
}
function enemyRarityAt(node, idx){
  // 구버전 세이브(진행 중이던 출정 런)에는 enemyRarity가 없을 수 있어서 그럴 땐 그냥 "일반"으로 취급(패시브 없음)
  return (node && node.enemyRarity && node.enemyRarity[idx]) || {rarity:'common', variant:'a'};
}

  if(t.count >= EXP_TICKET_MAX){ t.count = EXP_TICKET_MAX; t.lastTick = now; } // 가득 차 있는 동안은 타이머 정지
  else{
    const n = Math.floor((now - t.lastTick) / EXP_TICKET_INTERVAL_MS);
    if(n > 0){
      t.count = Math.min(EXP_TICKET_MAX, t.count + n);

function specialOverflowSlots(rule, elements, slotCount){

  if(rule.type!=='chain' && rule.type!=='relay') return out;
  const ok = rule.type==='chain' ? (a,b)=> !!a && a===b : (a,b)=> !!a && !!b && relayWin(a,b);
  let p = 0;

function specialSlotMarks(spec, elements, slotCount, isPlayer){

    if(k<0 || k>=slotCount) return;
    const m = marks[k] || (marks[k] = {cls, tags:[]});
    m.tags.push(tag); if(rank[cls] > rank[m.cls]) m.cls = cls;
  };
  specialRules(spec).forEach(r=>{
    const icon = SPECIAL_ICON[r.type];
    if(r.type==='goldenSlot'){ if(!isPlayer || elements[r.slot]) add(r.slot,'up','⭐×1.8'); }
    else if(r.type==='sealedSlot'){ if(!isPlayer || elements[r.slot]) add(r.slot,'down','🔒×0.5'); }
    else if(r.type==='field'){
      for(let k=0;k<slotCount;k++){ const e=elements[k]; if(e===r.up) add(k,'up','▲×1.3'); else if(e===r.down) add(k,'down','▼×0.7'); }

}

let modalScrollStack = [];
function installModalScrollKeeper(){
  const mr = document.getElementById('modalRoot'); if(!mr) return;
  const desc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  const keyOf = m => m ? (((m.querySelector('h3')||{}).textContent)||'').trim() : '';
  Object.defineProperty(mr, 'innerHTML', { configurable: true, get(){ return desc.get.call(this); }, set(v){
    const old = this.querySelector('.modal'), oldTop = old ? old.scrollTop : 0, oldKey = keyOf(old);
    const reset = !!window.__modalScrollReset; window.__modalScrollReset = false;
    desc.set.call(this, v);
    const nw = this.querySelector('.modal'), newKey = keyOf(nw);
    if(!nw){ modalScrollStack = []; return; }          // 완전히 닫힘
    if(reset){ modalScrollStack = []; return; }
    if(old && oldKey && oldKey===newKey){ if(oldTop>0) nw.scrollTop = oldTop; return; } // 같은 창 재렌더
    const at = newKey ? modalScrollStack.map(e=>e.key).lastIndexOf(newKey) : -1;
    if(at >= 0){ const top = modalScrollStack[at].top; modalScrollStack = modalScrollStack.slice(0, at); if(top>0) nw.scrollTop = top; return; } // 하위 창에서 돌아옴
    if(old && oldKey) modalScrollStack.push({ key: oldKey, top: oldTop });                                                                  // 하위 창으로 이동
  }});
}

function buildClashSequence(pairs){
  const stagger = 0.64, dur = 1.1; // 0.5배속 (기존 대비 2배 느리게)
  const advColor = {up:'#5cd65c', even:'#ffd24a', down:'#ff5a5a', none:'#8a8a9a'};
  let html = '';
  pairs.forEach((pair, idx)=>{
    const delay = idx*stagger;
    const dmgDelay = delay+dur*0.42;
    html += '<div class="clash-row">'
      + '<div class="clash-p" style="animation: clashLeft '+dur+'s ease-in-out; animation-delay: '+delay+'s; animation-fill-mode: both;">'+(pair.p||'·')+'</div>'
      + '<div class="clash-impact" style="animation: impactFlash 0.6s ease-out; animation-delay: '+dmgDelay+'s; animation-fill-mode: forwards;">💥</div>'
      + '<div class="clash-e" style="animation: clashRight '+dur+'s ease-in-out; animation-delay: '+delay+'s; animation-fill-mode: both;">'+pair.e+'</div>'
      + '</div>';
    if(typeof pair.dmg==='number'){
      if(typeof pair.edmg==='number'){
        const color = pair.dmg>pair.edmg ? advColor.up : (pair.dmg<pair.edmg ? advColor.down : advColor.even);
        html += '<div class="clash-dmg" style="color:'+color+'; animation: fadeUp 0.5s ease-out; animation-delay: '+dmgDelay+'s; animation-fill-mode: forwards;">'
          + (pair.crit?'⚡':'') + '아군 '+fmtDmg(pair.dmg)+' <span class="sub" style="font-size:10px;">vs</span> 적 '+fmtDmg(pair.edmg) + '</div>';
      }else{
        const color = advColor[pair.adv] || advColor.none;
        html += '<div class="clash-dmg" style="color:'+color+'; animation: fadeUp 0.5s ease-out; animation-delay: '+dmgDelay+'s; animation-fill-mode: forwards;">'+(pair.crit?'⚡':'')+fmtDmg(pair.dmg)+'</div>';
      }
    }
  });
  const totalMs = Math.round((Math.max(pairs.length-1,0))*stagger*1000 + dur*1000 + 150);
  return {html, totalMs};
}
function playBattleAnimation(i, playerPower, enemyPower, grade, slotDetails, enemySlotAtks, rewardBonusRate, reviveBonus, special){
  const pRatio = playerPower/(playerPower+enemyPower);

    pairs.push({p:pIcon, e:ELEMENT_INFO[enemyComp[idx]].icon, dmg: d?d.atk:0, edmg: eAtks[idx]||0, adv: d?d.adv:'none', crit: d?d.crit:false});

    + '</div>'
    + '<div id="powerCompare" class="sub" style="margin-top:6px; opacity:0; transition:opacity .4s;">⚔️ '+fmtDmg(playerPower)+' vs 👹 '+fmtDmg(enemyPower)+'</div>'
    + '<div id="battleResult" style="margin-top:14px; min-height:'+(145 + (!grade && reviveBonus>0 ? 21 : 0))+'px;">'+'<div data-placeholder style="min-height:inherit; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub); animation:pulseDim 1.6s ease-in-out infinite;">⚔️ 결과 계산 중…</div>'+'</div>'

    }, clash.totalMs);

function showSlotPicker(slotIdx, returnFn, enemyEl, rosterFilter, lineup){
  returnFn = returnFn || (()=>{ closeModal(); render(); });
  let options = Object.keys(SPIRITS).filter(k=>ownedCount(k)>0);
  if(rosterFilter) options = options.filter(k=>rosterFilter.includes(k));
  let html = '';
  if(enemyEl){
    html += '<div class="sub" style="text-align:center; margin-bottom:8px;">슬롯 '+(slotIdx+1)+' 상대: <span style="font-size:18px;">'+ELEMENT_INFO[enemyEl].icon+'</span> '+ELEMENT_INFO[enemyEl].name+' · 🟢유리 🔴불리</div>';
  }else if(lineup){
    html += '<div class="sub" style="text-align:center; margin-bottom:8px;">상대 '+lineup.map(e=>ELEMENT_INFO[e].icon).join('')+'</div>';
  }
  if(state.formation[slotIdx]){
    html += '<button class="btn secondary" id="clearSlot" style="margin-bottom:10px;">슬롯 비우기</button>';
  }
  // (v128) 가용 정령은 초록 테두리·"가용 N/보유"로 눈에 띄게 위에, 전부 다른 슬롯에서 쓰는 정령은 흐리게 아래에 ("사용 중 · 슬롯 N")
  const entries = options.map(key=>({ key, owned: ownedCount(key), free: ownedCount(key) - usedCountExcluding(key, slotIdx),
    users: state.formation.map((k,i)=> (k===key && i!==slotIdx) ? i+1 : null).filter(Boolean), isCur: state.formation[slotIdx]===key }));
  entries.sort((a,b)=> (b.isCur - a.isCur) || ((b.free>0) - (a.free>0)));
  const availN = entries.filter(e=>e.free>0).length, busyN = entries.length - availN;
  if(entries.length) html += '<div class="sub" style="text-align:center; margin-bottom:8px;">✅ 가용 '+availN+'종 · 🔒 사용 중 '+busyN+'종'+(busyN?' (눌러서 이동)':'')+'</div>';
  let busyDivider = false;
  entries.forEach(e=>{
    const key = e.key, free = e.free;
    const sp = SPIRITS[key];
    const info = RARITY_INFO[sp.rarity];
    if(free<=0 && !busyDivider){ busyDivider = true; html += '<div class="pk-div">🔒 사용 중 — 누르면 그 슬롯에서 이동해요</div>'; }
    const pill = e.isCur ? '<span class="pk-pill cur">📍 이 슬롯</span>'
      : (free>0 ? '<span class="pk-pill ok">✅ 가용 '+free+'/'+e.owned+'</span>'+(e.users.length?'<div class="sub" style="font-size:10px;">슬롯 '+e.users.join('·')+' 사용 중</div>':'')
                : '<span class="pk-pill busy">🔒 사용 중 · 슬롯 '+e.users.join('·')+'</span>');
    sp.passive = passiveFor(key);
    const previewEnemyComp = []; previewEnemyComp[slotIdx] = enemyEl || null;
    const fatM = (state.bossFight && rosterFilter) ? bossFatigueMult(state.bossFight, key) : 1;
    const atk = fmtDmg(baseSlotAtk(key, slotIdx, previewEnemyComp, null) * fatM);
    let advStyle = '', advBadge = '';
    if(enemyEl){
      const m = typeMult(sp.element, enemyEl);
      if(m>1){ advStyle = 'border-left:4px solid #5cd65c; background:#5cd65c14;'; advBadge = '<span style="color:#5cd65c; font-weight:800; font-size:12px;">🟢 유리</span>'; }
      else if(m<1){ advStyle = 'border-left:4px solid #ff5a5a; background:#ff5a5a14;'; advBadge = '<span style="color:#ff5a5a; font-weight:800; font-size:12px;">🔴 불리</span>'; }
      else { advStyle = 'border-left:4px solid #3a3a4a;'; advBadge = '<span class="sub" style="font-size:12px;">보통</span>'; }
    }else if(lineup){
      const t = lineupThreat(key, lineup);
      advStyle = 'border-left:4px solid '+(t.weak===0 ? '#5cd65c' : (t.weak>=2 ? '#ff5a5a' : '#3a3a4a'))+';';
      advBadge = t.weak ? '<span style="color:#ff8a8a; font-size:12px; font-weight:800;">⚠️'+t.weak+'</span>' : '';
    }
    html += '<div class="picker-item '+(e.isCur?'cur':(free>0?'avail':'busy'))+'" data-pick="'+key+'" style="'+advStyle+'">'
      + '<div style="font-size:22px;">'+ELEMENT_INFO[sp.element].icon+'</div>'
      + '<div style="flex:1;">'
        + '<div>'+sp.name+(sp.passive?' '+sp.passive.icon:'')+'</div>'
        + '<div class="rarity-tag" style="background:'+info.color+'22; color:'+info.color+'">'+info.name+'</div>'
        + (sp.passive?'<div class="sub" style="font-size:11px; margin-top:2px;">'+sp.passive.icon+' '+sp.passive.name+' · '+sp.passive.desc+'</div>':'')
        + '</div>'
      + '<div style="text-align:right;">'+advBadge+'<div style="font-weight:800; font-size:13px;">⚔️ '+atk+'</div><div>'+pill+'</div>'+(fatM<1?'<div style="color:#ff8a8a; font-size:11px; font-weight:700;">🔻 연전 피로 −'+Math.round((1-fatM)*100)+'%</div>':'')+'</div>'
      + '</div>';
  });
  if(options.length===0) html = rosterFilter ? '<div class="sub">출전 명단에 남은 정령 없음 — 다른 슬롯에서 이동</div>' : '<div class="sub" style="text-align:center;">보유 정령 없음 — 소환 먼저</div>';
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-bg" id="modalBg"><div class="modal" style="position:relative;">'
    + '<button class="close-x" id="modalClose">✕</button><h3>정령 배치</h3>' + html + '</div></div>';
  bindModalClose(returnFn);
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.pick;
      const free = ownedCount(key) - usedCountExcluding(key, slotIdx);
      if(free>0){
        state.formation[slotIdx] = key;
        save(); returnFn();
        return;
      }
      const sourceSlots = [];
      state.formation.forEach((k,idx)=>{ if(idx!==slotIdx && k===key) sourceSlots.push(idx); });
      if(sourceSlots.length<=1){
        if(sourceSlots.length===1) state.formation[sourceSlots[0]] = null;
        state.formation[slotIdx] = key;
        save(); returnFn();
      }else{
        showMoveSourcePicker(key, slotIdx, sourceSlots, returnFn);
      }
    });
  });
  const clearBtn = document.getElementById('clearSlot');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    state.formation[slotIdx] = null; save(); returnFn();
  });
}

function openInfoOverlay(title, bodyHtml, onClaim, refreshBody){
  const overlay = document.createElement('div');
  overlay.className = 'modal-bg';
  overlay.style.zIndex = '200';
  overlay.innerHTML = '<div class="modal" style="position:relative; max-width:280px;">'
    + '<button class="close-x" id="infoOverlayClose">✕</button>'
    + '<h3 style="text-align:center; margin-top:0;">'+title+'</h3>'
    + '<div id="infoOverlayBody">' + bodyHtml + '</div></div>';
  document.body.appendChild(overlay);
  const closeOverlay = ()=> overlay.remove();
  overlay.addEventListener('click', (ev)=>{ if(ev.target===overlay) closeOverlay(); });
  overlay.querySelector('#infoOverlayClose').addEventListener('click', closeOverlay);
  function bindOverlayClaims(){
    overlay.querySelectorAll('[data-claim-reward]').forEach(btn=>{
      if(btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', ()=>{
        if(btn.dataset.claimGroup){
          const ids = [...overlay.querySelectorAll('[data-claim-reward][data-claim-group="'+btn.dataset.claimGroup+'"]')].map(x=>x.dataset.claimReward);
          const r = claimManyPending(ids);
          if(r.n>0) toastReward({essence:r.essence, stone:r.stone, items:r.items}, '🎁 등급 보상 '+r.n+'개 획득');
        }else{
          claimPendingReward(btn.dataset.claimReward);
        }
        sfx('claim');
        if(onClaim) onClaim();
        if(refreshBody){
          document.getElementById('infoOverlayBody').innerHTML = refreshBody();
          bindOverlayClaims();
        }else{
          closeOverlay();
        }
      });
    });
  }
  bindOverlayClaims();
}
