<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);} html{scroll-padding-top:env(safe-area-inset-top,0px);}</style>
<title>정령 소환사</title>
<style>
  :root{
    --fire:#ff6b4a; --water:#4ac8ff; --wood:#5cd65c; --light:#ffe066; --dark:#9b6bff;
    --common:#b8bcc4; --rare:#4a90ff; --epic:#b04aff; --legendary:#ffb92a;
    --bg:#14141c; --panel:#1e1e2a; --panel2:#262636; --text:#eceef2; --sub:#9296a6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; overscroll-behavior:none;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
  header{padding:12px 14px; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg,#1e1e2e 0%,#2a2340 100%); border-bottom:1px solid #3d3a5a; position:sticky; top:0; z-index:5; box-shadow:0 2px 12px #00000055;}
  header .title{font-weight:700; font-size:16px; white-space:nowrap;}
  @media (max-width:350px){ header{padding:10px 8px; gap:4px;} header .title{font-size:14px;} header .essence{padding:5px 7px; font-size:13px;} }
  header .essence{background:linear-gradient(135deg,#2c2c3e,#1f1f2c); padding:6px 10px; border-radius:20px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:4px; border:1px solid #ffffff14; box-shadow:inset 0 1px 0 #ffffff0d;}
  main{flex:1; padding:12px; padding-bottom:80px; overflow-y:auto;}
  nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background:linear-gradient(180deg,#1e1e2a,#171720); border-top:1px solid #3d3a5a; z-index:10; box-shadow:0 -4px 16px #00000066;}
  nav button{flex:1; background:none; border:none; color:var(--sub); font-size:12px; padding:10px 0; display:flex; flex-direction:column; align-items:center; gap:2px;}
  nav button.active{color:#c8b8ff; font-weight:800; text-shadow:0 0 10px #8a5bff88;}
  nav button.active .ico{filter:drop-shadow(0 0 8px #8a5bffaa); transform:translateY(-2px);}
  nav button .ico{transition:transform .15s ease, filter .15s ease;}
  .navdot{display:none; position:absolute; top:-3px; right:-4px; width:8px; height:8px; border-radius:50%; background:#ff4a4a; border:1.5px solid var(--panel);}
  nav button.locked{opacity:0.4;}
  nav button.locked .ico{position:relative;}
  nav button.locked .ico::after{content:'🔒'; position:absolute; right:-6px; bottom:-4px; font-size:9px;}
  nav button .ico{font-size:20px;}
  h2{font-size:15px; margin:4px 0 10px;}
  .card{background:linear-gradient(160deg,#22222f 0%,#1a1a26 100%); border-radius:14px; padding:12px; margin-bottom:10px; border:1px solid #ffffff0f; box-shadow:0 4px 14px #00000040;}
  .btn{background:linear-gradient(135deg,#6a7bff,#9a6bff); color:#fff; border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:800; width:100%; box-shadow:0 4px 14px #7a5bff55, inset 0 1px 0 #ffffff33; transition:transform .08s ease, box-shadow .08s ease; letter-spacing:.2px;}
  .btn:active{transform:translateY(1px) scale(.99); box-shadow:0 2px 6px #7a5bff44;}
  .btn:disabled{background:#3a3a48; color:#777;}
  .btn.secondary{background:linear-gradient(135deg,#2c2c3e,#242432); color:var(--text); box-shadow:0 2px 8px #00000044, inset 0 1px 0 #ffffff0d; border:1px solid #ffffff12;}
  .btn.small{padding:8px; font-size:12px; width:auto;}
  .row{display:flex; gap:8px;}
  .grid5{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  .species-tile{background:var(--panel2); border-radius:10px; padding:8px 4px; text-align:center; position:relative; border:2px solid transparent;}
  .species-tile[data-manage]{cursor:pointer; border-color:#ffffff1a; box-shadow:0 2px 6px #00000055; transition:transform .1s ease, border-color .15s ease;}
  .species-tile[data-manage]:active{transform:scale(0.96);}
  .species-tile[data-manage]::after{content:'›'; position:absolute; bottom:2px; right:5px; font-size:13px; font-weight:900; color:var(--sub); opacity:0.6;}
  .species-tile .icon{font-size:22px;}
  .species-tile .name{font-size:10px; margin-top:2px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .species-tile .count{position:absolute; top:2px; right:4px; font-size:10px; background:#000a; padding:1px 5px; border-radius:8px;}
  .species-tile .passive-badge{position:absolute; top:2px; left:4px; font-size:11px;}
  .species-tile.undiscovered{opacity:0.35;}
/* (v99) 보스 출전 명단 선택 — 등급은 테두리·배경색, 유리는 아이콘 위 배지, 선택은 흰 링+체크 */
.roster-grid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px 7px; padding-top:4px;}
.roster-pick{position:relative; border-radius:12px; padding:9px 3px 7px; min-height:86px; text-align:center; cursor:pointer; border:2px solid #ffffff22; box-shadow:0 2px 6px #00000055; transition:transform .1s ease, box-shadow .15s ease;}
.roster-pick:active{transform:scale(0.95);}
.roster-pick .ico{position:relative; width:34px; height:34px; margin:0 auto; font-size:24px; display:flex; align-items:center; justify-content:center;}
.roster-pick .nm{font-size:10px; margin-top:3px; color:var(--text); opacity:.88; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.roster-pick .pv{position:absolute; top:3px; left:4px; font-size:11px;}
.roster-pick .pw{font-size:10px; font-weight:800; margin-top:1px; color:#dfe4ff;}
.roster-pick .pw .lv{margin-left:3px; font-size:9px; color:#ffd24a;}
.roster-pick .adv{position:absolute; right:-4px; bottom:-3px; width:15px; height:15px; border-radius:50%; background:#2fbf5a; color:#fff; font-size:8px; font-weight:900; display:flex; align-items:center; justify-content:center; border:1.5px solid #14141c;}
.roster-pick .pick-check{position:absolute; top:-7px; right:-6px; z-index:2; width:20px; height:20px; border-radius:50%; background:#fff; color:#3a48d8; font-size:12px; font-weight:900; display:none; align-items:center; justify-content:center; box-shadow:0 2px 6px #0009;}
.roster-pick.picked{box-shadow:0 0 0 2px #fff, 0 0 14px #8a9bffaa; transform:translateY(-1px);}
.roster-pick.picked .pick-check{display:flex;}
.roster-head{position:sticky; top:0; z-index:3; background:#242432; padding:8px 0 7px; margin:0 0 8px; border-bottom:1px solid #ffffff14;}
.roster-boss{display:flex; justify-content:center; align-items:center; gap:24px;}
.roster-boss .chip{display:flex; align-items:center; gap:8px;}
.roster-boss .ring{width:36px; height:36px; border-radius:50%; background:#1a1a22; border:3px solid #888; display:flex; align-items:center; justify-content:center; font-size:19px;}
.roster-boss .lab{text-align:left; line-height:1.2;}
.roster-boss .lab .k{font-size:10px; color:var(--sub);}
.roster-boss .lab .v{font-size:13px; font-weight:800;}
.roster-legend{display:flex; justify-content:center; flex-wrap:wrap; gap:3px 11px; font-size:10px; color:var(--sub); margin-bottom:8px;}
.roster-legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:-1px;}
.roster-legend .adv-sample{display:inline-flex; width:13px; height:13px; border-radius:50%; background:#2fbf5a; color:#fff; font-size:8px; font-weight:900; align-items:center; justify-content:center; margin-right:4px; vertical-align:-2px;}
  .rarity-tag{font-size:9px; padding:1px 6px; border-radius:6px; display:inline-block; margin-top:2px; font-weight:700;}
  .fuse-alert{background:var(--panel2); border-radius:10px; padding:8px 10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:13px;}
  .slot{position:relative; aspect-ratio:1; min-width:0; background:linear-gradient(160deg,#2a2a3a,#1f1f2c); border-radius:14px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:2px dashed #3d3a5a; font-size:11px; color:var(--sub); transition:transform .08s; overflow:hidden;}
  .slot:active{transform:scale(.96);}
  .slot.filled{border:2px solid #7a6bff; color:var(--text); box-shadow:0 0 12px #7a6bff55, inset 0 1px 0 #ffffff0d;}
  .slot .icon{font-size:26px;}
  .slot.bonus-up{border-color:#ffd24a; background:linear-gradient(160deg,#4a3a10,#2a2210); box-shadow:0 0 14px #ffd24acc, inset 0 0 12px #ffd24a44;}
  .slot.bonus-down{border-color:#ff6a6a; background:linear-gradient(160deg,#3d1a1a,#241010); box-shadow:0 0 12px #ff6a6a99, inset 0 0 10px #ff6a6a33;}
  .bonus-tag{position:absolute; top:2px; right:2px; border-radius:8px; font-size:9px; font-weight:900; padding:0 4px; line-height:14px; white-space:nowrap; z-index:2;}
  .bonus-pill{display:inline-block; border-radius:9px; font-size:10px; font-weight:900; padding:0 6px; line-height:16px; white-space:nowrap;}
  .bonus-tag.up,.bonus-pill.up{background:#ffd24a; color:#2a1a00;}
  .bonus-tag.down,.bonus-pill.down{background:#ff6a6a; color:#2a0000;}
  .slot.bonus-max{border:2px dashed #ffd24a99; background:linear-gradient(160deg,#37321f,#25221a); box-shadow:none;}
  .bonus-tag.max,.bonus-pill.max{background:transparent; color:#ffd24add; border:1px dashed #ffd24a99;}
  .tw-row{display:grid; grid-template-columns:62% 38%; height:54px; align-items:center;}
  .tw-body{height:100%; display:flex; align-items:center; justify-content:center;
    background:repeating-linear-gradient(90deg, transparent 0 34px, #0000002e 34px 36px), repeating-linear-gradient(0deg, #00000038 0 2px, transparent 2px 27px), linear-gradient(90deg,#2a2840,#3b3860 50%,#2a2840);
    border-left:4px solid #17152b; border-right:4px solid #17152b;}
  .tw-btn{width:82%; height:38px; border-radius:10px; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; border:2px solid;}
  .tw-btn.done{background:#34406f; border-color:#6b7bff99; color:#fff;}
  .tw-btn.now{background:linear-gradient(135deg,#ffb92a,#ff8a3a); border-color:#ffe08a; color:#2a1400; animation:twPulse 1.6s infinite;}
  .tw-btn.lock{background:#22222e; border-color:#33334a; color:#6a6a80;}
  @keyframes twPulse{0%,100%{box-shadow:0 0 6px #ffb92a66;}50%{box-shadow:0 0 18px #ffb92acc;}}
  .tw-reward{margin-left:8px; padding:5px 9px; border-radius:10px; font-size:12px; font-weight:800; display:flex; flex-direction:column; align-items:center; line-height:1.2; border:1px solid #ffffff22; background:#ffffff0d; color:var(--sub); white-space:nowrap;}
  .tw-reward.claim{background:#5b6bff33; border-color:#ffd24a; color:#fff; box-shadow:0 0 10px #ffd24a66; cursor:pointer;}
  .tw-reward.done{opacity:.5;}
  .slot.skill-ready{box-shadow:0 0 0 2px #ffd24a, 0 0 12px #ffd24a99;}
  .slot.skill-cd{opacity:.55;}
  .skill-badge{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#0006; display:flex; align-items:center; justify-content:center; font-size:11px; z-index:2;}
  .skill-badge.cd{background:#000a; color:#ff8a8a; font-weight:900; font-size:10px;}
  .skill-target-ok{outline:2px dashed #ffd24a; border-radius:10px; cursor:pointer;}
  .skill-target-no{opacity:.3;}
  /* ===== (v139) 전장 화면: 앱 화면 자체가 전장으로 바뀜 ===== */
  body.in-battle #app > :not(#battleScreen){display:none !important;}
  #battleScreen{position:relative; width:100%; max-width:480px; margin:0 auto; flex:1; min-height:100vh; padding:8px 8px 12px; display:flex; flex-direction:column; gap:6px; overflow:hidden;}
  .bs-top{display:flex; align-items:center; gap:8px;}
  .bs-exit{background:#ffffff14; border:1px solid #ffffff33; border-radius:9px; padding:5px 9px; font-size:12px; color:var(--text); white-space:nowrap;}
  .bs-title{flex:1; text-align:center; font-weight:800; font-size:14px; white-space:nowrap;}
  .bs-order{display:flex; align-items:center; gap:4px; padding:5px 8px; background:#ffffff0d; border:1px solid #ffffff12; border-radius:12px; overflow:hidden; min-height:40px;}
  .bs-order .lbl{font-size:10px; color:var(--sub); margin-right:2px; white-space:nowrap;}
  .bs-order .oc{width:24px; height:24px; flex-shrink:0; border-radius:50%; background:#1b2233; border:2px solid #6b82ff; display:flex; align-items:center; justify-content:center; font-size:12px;}
  .bs-order .oc.en{border-color:#ff6a5a;}
  .bs-order .oc.now{width:30px; height:30px; font-size:16px; border-color:#ffd24a; box-shadow:0 0 8px #ffd24aaa;}
  .bs-order .oc.nx{opacity:.4;}
  .bs-order .sep{width:1px; height:18px; background:#ffffff33; margin:0 2px; flex-shrink:0;}

  /* 눈밭: 하늘 없이 옅은 설원 + 멀리 보이는 눈 언덕 + 내리는 눈 */
  .bs-field{position:relative; flex:1; min-height:0; border-radius:18px; overflow:hidden; padding:14px 6px 12px 22px; display:flex; flex-direction:column; justify-content:space-evenly; gap:2px;
    background:linear-gradient(180deg,#d7e4f2 0%,#e3edf8 28%,#eef4fb 60%,#f8fbfe 100%);
    box-shadow:inset 0 -30px 50px #ffffff, 0 6px 18px #0007;}
  .bs-field::before{content:''; position:absolute; left:0; right:0; top:0; height:64px; pointer-events:none;
    background:linear-gradient(180deg,#bcd0e6,#d0dff0);
    clip-path:polygon(0 72%,10% 44%,22% 62%,36% 34%,50% 58%,63% 28%,78% 54%,90% 38%,100% 56%,100% 0,0 0);}
  .bs-field::after{content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 42% 7% at 28% 57%,#c9d8e988,transparent 72%), radial-gradient(ellipse 36% 6% at 74% 80%,#c9d8e988,transparent 72%), radial-gradient(ellipse 30% 5% at 62% 36%,#c9d8e977,transparent 72%);}
  .bs-snow{position:absolute; left:0; right:0; top:-200px; height:calc(100% + 200px); pointer-events:none; z-index:4; opacity:.9;
    background-image:radial-gradient(2.5px 2.5px at 12% 14%,#fff 60%,transparent 66%), radial-gradient(2px 2px at 38% 52%,#fff 60%,transparent 66%),
      radial-gradient(3px 3px at 64% 26%,#fff 60%,transparent 66%), radial-gradient(2px 2px at 86% 70%,#fff 60%,transparent 66%),
      radial-gradient(2.5px 2.5px at 24% 84%,#fff 60%,transparent 66%), radial-gradient(1.5px 1.5px at 52% 6%,#fff 60%,transparent 66%);
    background-size:200px 200px; filter:drop-shadow(0 0 1px #9bb3cf); animation:bsSnow 10s linear infinite;}
  @keyframes bsSnow{from{transform:translateY(0)} to{transform:translateY(200px)}}
  .bs-row{position:relative; z-index:2; display:flex; justify-content:space-evenly; align-items:flex-end; min-height:10px;}
  .bs-rowtag{position:absolute; left:-18px; top:50%; transform:translateY(-50%); writing-mode:vertical-rl; letter-spacing:1px; font-size:9px; font-weight:800; color:#5b6f8c; background:#ffffffc0; padding:4px 1px; border-radius:6px;}
  .bs-mid{position:relative; z-index:3; height:30px; display:flex; align-items:center; justify-content:center;}
  .bs-mid::before{content:''; position:absolute; left:4%; right:4%; top:50%; border-top:2px dashed #9fb4cf88;}
  .bs-log{position:relative; background:#1a2438e0; color:#fff; font-size:11px; font-weight:600; padding:4px 12px; border-radius:12px; max-width:94%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* 유닛: 눈 위에 서 있는 정령(그림자) + 이름표 + 체력바 */
  .bu{position:relative; width:72px; display:flex; flex-direction:column; align-items:center;}
  .bu-body{position:relative; width:var(--sz); height:var(--sz); display:flex; align-items:center; justify-content:center;}
  .bu-icon{position:relative; z-index:1; font-size:calc(var(--sz) * .8); line-height:1; filter:drop-shadow(0 2px 2px #0005);}
  .bu-shadow{position:absolute; left:50%; bottom:-4px; width:calc(var(--sz) * .95); height:calc(var(--sz) * .24); transform:translateX(-50%); border-radius:50%;
    background:radial-gradient(ellipse,#3b4d6a70 0%,transparent 70%);}
  .bu-cur .bu-plate{background:#2f5bdc;}
  .bu-tap{cursor:pointer;}
  .bu-target .bu-body::after{content:''; position:absolute; inset:-5px -5px -3px -5px; z-index:2; pointer-events:none; filter:drop-shadow(0 0 3px #ffc800);
    background:linear-gradient(#ffc800,#ffc800) left top/12px 3px no-repeat, linear-gradient(#ffc800,#ffc800) left top/3px 12px no-repeat,
      linear-gradient(#ffc800,#ffc800) right top/12px 3px no-repeat, linear-gradient(#ffc800,#ffc800) right top/3px 12px no-repeat,
      linear-gradient(#ffc800,#ffc800) left bottom/12px 3px no-repeat, linear-gradient(#ffc800,#ffc800) left bottom/3px 12px no-repeat,
      linear-gradient(#ffc800,#ffc800) right bottom/12px 3px no-repeat, linear-gradient(#ffc800,#ffc800) right bottom/3px 12px no-repeat;
    animation:tgtPulse 1s ease-in-out infinite;}
  @keyframes tgtPulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
  .bu-target .bu-plate, .bu-enemy.bu-target .bu-plate{background:#ffc800; color:#2a1a00;}
  .bu-effin{font-weight:900; margin-left:2px;} .bu-effin.up{color:#0f7a2b;} .bu-effin.down{color:#7a3a14;}
  @keyframes buPulse{0%,100%{opacity:1} 50%{opacity:.5}}
  .bu-marker{position:absolute; top:-15px; left:50%; transform:translateX(-50%); z-index:5; color:#2f5bdc; font-size:13px; text-shadow:0 1px 0 #fff; animation:curBob 1s ease-in-out infinite;}
  @keyframes curBob{0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,3px)}}
  .bu-badge{position:absolute; top:-4px; right:-14px; z-index:3; background:#ffd24a; color:#2a1a00; font-size:9px; font-weight:900; padding:1px 5px; border-radius:8px; white-space:nowrap; box-shadow:0 1px 3px #0004;}
  .bu-badge.cd{background:#3a4458; color:#ffc2c2;}
  .bu-plate{margin-top:9px; max-width:72px; background:#1a2438e0; color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bu-enemy .bu-plate{background:#5a1f1fe0;}
  .bu-hp{margin-top:2px; width:56px; height:6px; border-radius:4px; background:#1a24384d; overflow:hidden;}
  .bu-hp > div{height:100%; background:linear-gradient(90deg,#4f63ff,#8a5bff);}
  .bu-enemy .bu-hp > div{background:#ff4040;}
  .bu-hpnum{font-size:9px; font-weight:700; color:#33435c; margin-top:1px;}
  .bu-dead .bu-icon, .bu-dead .bu-plate, .bu-dead .bu-hp, .bu-dead .bu-hpnum, .bu-dead .bu-shadow{opacity:.35; filter:grayscale(1);}
  .bu-dead .bu-icon{transform:rotate(80deg) scale(.8);}

  /* 행동 연출 */
  .fx-lunge-up .bu-body{animation:fxLungeUp .45s ease-out;}
  .fx-lunge-down .bu-body{animation:fxLungeDown .45s ease-out;}
  .fx-hit .bu-body{animation:fxHit .4s ease-out .15s;}
  .fx-hit .bu-icon{animation:fxFlash .55s ease-out .15s;}
  .fx-heal .bu-icon{animation:fxGlow .8s ease-out;}
  @keyframes fxLungeUp{0%{transform:translateY(0)} 35%{transform:translateY(-26px) scale(1.1)} 100%{transform:translateY(0)}}
  @keyframes fxLungeDown{0%{transform:translateY(0)} 35%{transform:translateY(26px) scale(1.1)} 100%{transform:translateY(0)}}
  @keyframes fxHit{0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}
  @keyframes fxFlash{0%{filter:brightness(2.4) drop-shadow(0 0 10px #ff3b3b)} 100%{filter:drop-shadow(0 2px 2px #0005)}}
  @keyframes fxGlow{0%{filter:drop-shadow(0 0 14px #3ccf5a)} 100%{filter:drop-shadow(0 2px 2px #0005)}}
  .bu-float{position:absolute; left:50%; top:-10px; z-index:6; font-size:17px; font-weight:900; color:#e52020; white-space:nowrap; pointer-events:none;
    text-shadow:0 1px 0 #fff,0 0 4px #fff,0 0 4px #fff; animation:fxFloat 1.1s ease-out .15s both;}
  .bu-float.crit{font-size:21px; color:#ff6a00;}
  .bu-float.heal{color:#16913a;}
  .bu-float.buff{color:#1c63c9; font-size:13px;}

<script>
// ===================== 데이터 =====================
const ELEMENTS = ['fire','water','wood','light','dark'];
const ELEMENT_INFO = {
  fire:{name:'화염', icon:'🔥', color:'var(--fire)'},
  water:{name:'물결', icon:'💧', color:'var(--water)'},
  wood:{name:'숲결', icon:'🌿', color:'var(--wood)'},
  light:{name:'빛', icon:'🌟', color:'var(--light)'},
  dark:{name:'그림자', icon:'🌑', color:'var(--dark)'}
};
const RARITY_ORDER = ['common','rare','epic','legendary','mythic'];
// (v101) 속성 표기는 항상 '아이콘 + 공식 이름'(화염·물결·숲결·빛·그림자)으로 통일 — 문구에서 직접 '불/물/나무' 등을 쓰지 않고 이 함수를 사용
function elLabel(el){ return ELEMENT_INFO[el].icon+' '+ELEMENT_INFO[el].name; }
const RARITY_INFO = {
  common:{name:'일반', mult:1, color:'var(--common)'},
  rare:{name:'레어', mult:2.5, color:'var(--rare)'},
  epic:{name:'에픽', mult:6, color:'var(--epic)'},
  legendary:{name:'레전더리', mult:15, color:'var(--legendary)'},
  mythic:{name:'신화', mult:35, color:'#ff4fd8'}
};
const NAMES = {
  // (v157) 짜치는 "속성+등급형용사+종" 반복 조합을 버리고 고유명사·신화 모티프 위주로 재작성
  fire:{common:['잉걸','불티'], rare:['하랑','적작'], epic:['볼칸','주작'], legendary:['펜리르','불사조'], mythic:['스콜','삼족오']},
  water:{common:['이슬','물뱀'], rare:['나이아','백사'], epic:['로렐라이','이무기'], legendary:['세이렌','청룡'], mythic:['테티스','요르문간드']},
  wood:{common:['이끼','실이'], rare:['등돌','독줄'], epic:['반석','아라크네'], legendary:['지신','그림자여왕'], mythic:['현무','아난시']},
  light:{common:['빛씨','별가루'], rare:['지천사','은사슴'], epic:['대천사','유니콘'], legendary:['치천사','키린'], mythic:['광명','백록']},
  dark:{common:['박쥐','까마귀'], rare:['야행자','흉조'], epic:['흡혈귀','후긴'], legendary:['흡혈백작','무닌'], mythic:['불사귀','칠흑조']}
};
const VARIANTS = ['a','b'];
const SPIRITS = {};
ELEMENTS.forEach(el=>{
  RARITY_ORDER.forEach(r=>{
    VARIANTS.forEach((v, vi)=>{
      const key = el+'_'+r+'_'+v;
      SPIRITS[key] = {key, element:el, rarity:r, variant:v, name:NAMES[el][r][vi]};
    });
  });
});
function siblingKey(key){
  const sp = SPIRITS[key];
  const otherV = sp.variant==='a' ? 'b' : 'a';
  return sp.element+'_'+sp.rarity+'_'+otherV;
}
const BASE_ATK = 12;
const SUMMON_COST = 100;
const CHAPTER_LENGTH = 10;
function seededRand(seed){ const x = Math.sin(seed)*10000; return x - Math.floor(x); }
// 적한테도 정령과 똑같이 등급(일반~신화)·variant를 부여해서 특성(패시브)을 갖게 함.
// 진행도(progress, 0~1)가 높을수록 높은 등급이 더 잘 나오도록 가중치를 선형 보간.
// 신화는 최후반부에도 1%로 아주 희박하게만 등장(대신 걸리면 팀 전체 공격력 +10% 통솔까지 붙는 강적).
// 다만 이 등급은 "패시브가 있는지"를 정하는 역할이지, 정령처럼 등급별 배수(x1~x35)를 곱하진 않음 —
// 그렇게 하면 스테이지 난이도 곡선과 별개로 적 전투력이 등급 뽑기 운에 따라 최대 35배까지 요동쳐서
// 기존에 맞춰둔 난이도 곡선이 무의미해짐. 그래서 적의 전투력은 지금처럼 스테이지/층 진행도로만 스케일하고,
// 등급은 패시브 발동 여부(공격력 +8~35%, 크리티컬 확률 등)만 결정함.
function enemyRarityWeights(progress){
  const p = Math.max(0, Math.min(1, progress));
  return [
    {r:'common', w: Math.max(1, 90-55*p)},
    {r:'rare', w: 9+30*p},
    {r:'epic', w: 1+18*p},
    {r:'legendary', w: 6*p},
    {r:'mythic', w: 1*p}
  ];
}
function weightedPickSeeded(list, r){
  const total = list.reduce((s,x)=>s+x.w,0);
  let x = r*total;
  for(const item of list){ if(x<item.w) return item.r; x -= item.w; }
  return list[list.length-1].r;
}
function enemyRarityComp(seedBase, progress){
  const weights = enemyRarityWeights(progress);
  const arr = [];
  for(let j=0;j<5;j++){
    const rarityRoll = seededRand(seedBase*173.31 + j*29.7 + 3);
    const variantRoll = seededRand(seedBase*211.7 + j*17.9 + 5);
    arr.push({ rarity: weightedPickSeeded(weights, rarityRoll), variant: variantRoll<0.5?'a':'b' });
  }
  return arr;
}
function enemyRarityCompForStage(i){ return enemyRarityComp(i, i/99); }
function enemyRarityCompForTower(floor){ return enemyRarityComp(floor+5000, Math.min(1, floor/50)); }
function baseEnemyComposition(i){
  const arr = [];
  for(let j=0;j<5;j++){
    const r = seededRand(i*97.13 + j*13.37 + 1);
    arr.push(ELEMENTS[Math.floor(r*ELEMENTS.length)]);
  }
  return arr;
}
// (v115) 특수 스테이지의 적은 규칙 조건을 항상 충족하는 구성으로 나옴 — 슬롯이 3~5개 어느 쪽이든 앞쪽 슬롯부터 충족되게 배치
// (v116) 규칙이 둘인 스테이지도 둘 다 충족하는 구성. 속성 필드가 있으면 적은 유리한 속성 3칸에 불리한 속성은 없음(커버리지와 같이 나오면 필수 속성 때문에 예외)
function stageEnemyComposition(i){
  const arr = baseEnemyComposition(i);

function bossTurnConstraint(stageIdx, turn){
  const seed = stageIdx*733 + turn*97 + 41;
  if(seededRand(seed) > BOSS_TURN_CONSTRAINT_CHANCE) return null;
  const type = BOSS_TURN_CONSTRAINT_TYPES[Math.floor(seededRand(seed+1)*BOSS_TURN_CONSTRAINT_TYPES.length)];
  if(type==='sequence'){
    const pattern=[];
    for(let k=0;k<3;k++) pattern.push(ELEMENTS[Math.floor(seededRand(seed+2+k*1.3)*ELEMENTS.length)]);
    return {type, pattern};
  }
  if(type==='coverage'){
    const first = ELEMENTS[Math.floor(seededRand(seed+2)*ELEMENTS.length)];
    let second=first, tries=0;
    while(second===first && tries<10){ second=ELEMENTS[Math.floor(seededRand(seed+3+tries*1.1)*ELEMENTS.length)]; tries++; }
    return {type, required:[first,second]};
  }
  return {type}; // chain/diversity/relay는 추가 파라미터 불필요
}
function bossTurnConstraintLabel(spec){
  // 속성 아이콘 앞에 유형별 장식 아이콘(📿🧩🔗 등)을 붙였더니 오히려 헷갈린다는 피드백 반영 —
  // 유형 아이콘은 다 빼고 "이번 턴 제약" 헤더 쪽에만 하나 두기로 함(showBossFightScreen 참고)
  if(!spec) return null;
  if(spec.type==='sequence') return spec.pattern.map(el=>ELEMENT_INFO[el].icon).join(' → ')+' 순서로 채우면 보너스';
  if(spec.type==='coverage') return spec.required.map(el=>ELEMENT_INFO[el].icon).join(' + ')+' 둘 다 있으면 보너스';
  if(spec.type==='chain') return '같은 속성을 나란히 배치하면 보너스 · 최대 3쌍';
  if(spec.type==='diversity') return '서로 다른 속성을 많이 쓸수록 보너스';
  return '슬롯 순서대로 상성 우위가 이어지면 보너스 · 최대 3쌍 · 빛 앞에서는 비겨도 인정';
}
function startBossFight(stageIdx, roster){
  // 보스전 동안은 진형 슬롯을 "출전 명단" 전용으로 임시로 쓰고, 끝나면 원래 진형으로 복원함
  // (그대로 두면 보스전에서 골라놓은 조합이 스테이지/탑/출정 진형까지 바뀌어버림)
  const formationSnapshot = state.formation.slice();
  const myMax = rosterMaxHp(roster), bossMax = bossMaxHp(stageIdx);
  state.bossFight = { stageIdx, turn: 1, myHp: myMax, bossHp: bossMax, myMax, bossMax, bossBaseMax: bossMax, enrageApplied: 1, roster, formationSnapshot, streak: {} };
  state.formation = state.formation.map(()=>null); // (v120) 보스전은 매 턴 진형을 새로 짬
  bossViewTab = 'now';
  save();
  showBossFightScreen();
}
function endBossFight(){
  // 승리/패배/항복 어느 쪽으로 끝나든 공통으로 호출 — 진형을 원래대로 되돌리고 전투 상태를 지움
  const bf = state.bossFight;
  if(bf && bf.formationSnapshot) state.formation = bf.formationSnapshot;
  state.bossFight = null;
  save();
}

function resolveBossFightTurn(bossComp, bossRarity, constraint){
  const bf = state.bossFight;
  ensureBossFightHp(bf);
  const stageIdx = bf.stageIdx, turn = bf.turn;
  const slots = unlockedSlotCount();
  let playerPower = 0, hasMythicLeader=false, reviveBonus=0, rewardBonusRate=0, pNoFatigue=0;
  const slotDetails = [];
  state.formation.forEach((key,idx)=>{
    if(idx>=slots) return;
    if(!key){ slotDetails.push(null); return; }
    const sp = SPIRITS[key];
    const passive = passiveFor(key);
    if(sp.rarity==='mythic') hasMythicLeader = true;
    if(passive && passive.reviveBonus) reviveBonus = Math.max(reviveBonus, passive.reviveBonus);
    if(passive && passive.rewardBonus) rewardBonusRate = Math.max(rewardBonusRate, passive.rewardBonus);
    let atk = baseSlotAtk(key, idx, bossComp, constraint);
    let crit = false;
    if(passive && passive.crit && Math.random()<passive.crit.chance){ atk *= passive.crit.mult; crit = true; }
    pNoFatigue += atk;
    atk *= bossFatigueMult(bf, key); // (v117) 연속 출전 피로
    playerPower += atk;
    slotDetails.push({ atk, adv: slotAdvantage(key, bossComp[idx]), crit });
  });
  if(hasMythicLeader) playerPower *= 1.1;
  if(constraint) playerPower *= specialAggregateMultForFormation(constraint);
  const basePerSlot = bossTurnBasePower(stageIdx, turn);
  let bossHasMythicLeader = false;
  const enemyRawAtks = bossComp.slice(0,slots).map((el,idx)=>{
    const rv = bossRarity[idx];
    if(rv.rarity==='mythic') bossHasMythicLeader = true;
    const passive = passiveForERV(el, rv.rarity, rv.variant);
    let v = basePerSlot * ELEMENT_ATK_MULT[el] * enemyMatchupMult(idx, el, passive);
    if(passive && passive.atkMult) v *= passive.atkMult;
    if(passive && passive.crit && Math.random()<passive.crit.chance) v *= passive.crit.mult;
    return v;
  });
  let bossPower = enemyRawAtks.reduce((a,b)=>a+b,0);
  if(bossHasMythicLeader) bossPower *= 1.1;
  if(constraint) bossPower *= specialAggregateMultForEnemy(constraint, bossComp, slots);
  const bossPhase = bossTurnPattern(turn);
  bossPower *= bossPhase.mult; // (v117) 기본 ×1 / 강타 / 피로
  const bossEnrage = bossEnrageMult(turn);
  bossPower *= bossEnrage; // (v120) 각성: 보스 정령력(=공격력) 증가
  // 화면에 보여줄 슬롯별 수치는 각각 독립 반올림하고, 전체 합계도 "그 반올림된 슬롯들의 합"으로 통일함 —
  // 그래야 화면에 찍힌 슬롯 숫자를 손으로 더했을 때 항상 표시된 총합이랑 정확히 일치함(실제 승패 계산은 아래
  // playerPower/bossPower 원본 정밀값을 그대로 씀 — 화면 표시만 이렇게 다시 계산해서 보여줌)
  // (v91 수정) 신화 통솔·제약 배율이 총합에만 곱해지고 슬롯 표시값엔 빠져 있어서, 화면에는 "나 252 vs 보스 334"로 찍히는데
  // 실제 판정은 453.6 vs 333.8(제약 x1.8)로 내가 이기는 불일치가 있었음. 일반 스테이지처럼 배율을 슬롯 표시값에
  // 미리 곱해서(displayFactor) 슬롯 합 = 총합 = 실제 판정값이 되도록 맞춤
  const rawPlayerSum = slotDetails.reduce((a,d)=>a+(d?d.atk:0),0);
  const playerFactor = rawPlayerSum>0 ? playerPower/rawPlayerSum : 1;
  const rawBossSum = enemyRawAtks.reduce((a,b)=>a+b,0);
  const bossFactor = rawBossSum>0 ? bossPower/rawBossSum : 1;
  const enemySlotDisplay = distributeRounded(enemyRawAtks.map(v=>v*bossFactor));
  const bossPowerDisplay = enemySlotDisplay.reduce((a,b)=>a+b,0);
  const playerSlotDisplay = distributeRounded(slotDetails.map(d=> d?d.atk*playerFactor:0));
  slotDetails.forEach((d,idx)=>{ if(d) d.atk = playerSlotDisplay[idx]; });
  const playerPowerDisplay = playerSlotDisplay.reduce((a,b)=>a+b,0);
  // (v92) 총합 계산 내역 — 화면의 ⓘ 버튼 팝업용
  const pMults = [], bMults = [];
  if(pNoFatigue>0 && rawPlayerSum/pNoFatigue < 1-1e-9) pMults.push({label:'연전 피로', v:rawPlayerSum/pNoFatigue});
  if(hasMythicLeader) pMults.push({label:'신화 통솔', v:1.1});
  if(bossHasMythicLeader) bMults.push({label:'신화 통솔', v:1.1});
  if(constraint){
    const pm = specialAggregateMultForFormation(constraint), bm = specialAggregateMultForEnemy(constraint, bossComp, slots);
    if(Math.abs(pm-1)>1e-9) pMults.push({label:'이번 턴 제약', v:pm});
    if(Math.abs(bm-1)>1e-9) bMults.push({label:'이번 턴 제약', v:bm});
  }
  if(bossPhase.mult!==1) bMults.push({label:bossPhase.icon+' '+bossPhase.name, v:bossPhase.mult});
  if(bossEnrage>1) bMults.push({label:'🔥 각성', v:bossEnrage});
  const calc = { pSlot: pNoFatigue, pMults, pTotal: playerPowerDisplay, bSlot: rawBossSum, bMults, bTotal: bossPowerDisplay };
  // (수정) 정규화 없이 단순 차이로 데미지 계산. bossTurnBasePower 버그(슬롯당 값을 5슬롯 합계로 잘못 계산)를
  // 고치고 나면 양쪽 전투력이 원래 자연스럽게 비슷한 스케일로 나오게 설계돼 있어서(정상 스테이지랑 같은 계산식),
  // 굳이 별도 정규화가 필요 없음 — 그냥 차이만큼 데미지
  let dmgToBoss=0, dmgToPlayer=0;
  if(playerPower>=bossPower){
    dmgToBoss = Math.min(playerPower-bossPower, BOSS_DMG_CAP*bf.bossMax); // (v117) 한 턴 피해 상한
  }else{
    dmgToPlayer = Math.min(bossPower-playerPower, BOSS_DMG_CAP*bf.myMax);
  }
  bf.bossHp = Math.max(0, bf.bossHp-dmgToBoss);
  bf.myHp = Math.max(0, bf.myHp-dmgToPlayer);
  // (v117) 연속 출전 기록 — 이번 턴에 나간 정령은 +1, 쉰 정령은 0으로 되돌림
  bf.streak = bf.streak || {};
  const usedNow = state.formation.slice(0,slots);
  bf.roster.forEach(k=>{ bf.streak[k] = usedNow.includes(k) ? (bf.streak[k]||0)+1 : 0; });
  // (v122) 결과를 연출 전에 저장 — 연출 도중에 앱이 꺼져도 같은 결과 화면으로 이어짐(다시 굴리기 방지)
  bf.result = { turn, dmgToBoss, dmgToPlayer, playerPower: playerPowerDisplay, bossPower: bossPowerDisplay, reviveBonus, rewardBonusRate, calc, outcome: null, reviveGranted: false };
  save();
  playBossTurnAnimation(bf, slotDetails, enemySlotDisplay, bossComp, dmgToBoss, dmgToPlayer, playerPowerDisplay, bossPowerDisplay, reviveBonus, rewardBonusRate, calc);
}
// (v122) 턴 결과 표시(연출 뒤 / 재접속 후 공통). 승리 보상·위로 보상은 한 번만 지급되도록 결과에 기록
function renderBossTurnResult(bf, playSound){
  const box = document.getElementById('battleResult');
  const res = bf.result;
  if(!box || !res) return;
  const sb = document.getElementById('skipAnimBtn'); if(sb) sb.remove();
  const dmgToBoss = res.dmgToBoss, dmgToPlayer = res.dmgToPlayer;
  save();
  if(bf.bossHp<=0){
    if(playSound) sfx('win');

function playBossTurnAnimation(bf, slotDetails, enemySlotAtks, bossComp, dmgToBoss, dmgToPlayer, playerPower, bossPower, reviveBonus, rewardBonusRate, calc){
  const slots = unlockedSlotCount();
  const pairs = [];
  for(let idx=0; idx<slots; idx++){
    const key = state.formation[idx];

  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-bg wide" id="modalBg"><div class="modal battle-modal wide" style="text-align:center; position:relative;">'
    + '<h3>👑 '+bf.turn+'턴 결과</h3>'
    + clash.html
    + '<div id="powerCompare" style="font-size:15px; margin-top:6px; opacity:0; transition:opacity .4s;">⚔️ 나 '+fmtDmg(playerPower)+' <span class="sub">vs</span> 보스 '+fmtDmg(bossPower)+'<button id="powerInfoBtn" style="'+INFO_BTN_STYLE+'">ⓘ</button></div>'
    + '<div id="hpBarRow" style="display:flex; gap:8px; margin-top:8px; opacity:0; transition:opacity .4s;">'

    + '<div style="flex:1;"><div class="sub" style="text-align:center; font-size:11px;">💀 보스 체력 <span id="bossHpTxt">'+fmtHp(beforeBossHp)+'</span>/'+fmtHp(bf.bossMax)+'</div><div style="height:14px; border-radius:8px; overflow:hidden; background:#333; margin-top:2px;"><div id="bossHpBar" style="height:100%; width:'+(beforeBossHp/bf.bossMax*100)+'%; background:#ff4a4a; transition:width 0.8s ease-out;"></div></div></div>'
    + '</div>'
    + '<div id="battleResult" style="margin-top:14px; min-height:'+(bf.bossHp<=0 ? (state.stageBest[bf.stageIdx] ? 145 : 186) : (bf.myHp<=0 ? (reviveBonus>0 ? 166 : 145) : 80))+'px;">'+'<div data-placeholder style="min-height:inherit; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub); animation:pulseDim 1.6s ease-in-out infinite;">⚔️ 결과 계산 중…</div>'+'</div>'
    + '<button id="skipAnimBtn" class="btn secondary small" style="width:auto; position:absolute; right:12px; bottom:12px; padding:4px 10px; font-size:12px; opacity:.85;">⏩ 넘기기</button>'
    + '</div></div>';
  const pib = document.getElementById('powerInfoBtn');
  if(pib) pib.addEventListener('click', (e)=>{ e.stopPropagation(); openInfoOverlay('⚔️ 전투력 계산', bossPowerInfoHtml(calc, bf, dmgToBoss, dmgToPlayer)); });
  // ① 클래시가 끝나면 전체 전투력 비교 → ② 체력바 → ③ 결과. (v120) 탭하거나 ⏩를 누르면 남은 연출을 건너뜀
  const stepPower = ()=>{ const pc = document.getElementById('powerCompare'); if(pc) pc.style.opacity = 1; };
  const stepHp = ()=>{
    const row = document.getElementById('hpBarRow'); if(row) row.style.opacity = 1;
    requestAnimationFrame(()=>{
      const myBar = document.getElementById('myHpBar'); if(myBar) myBar.style.width = Math.max(0,bf.myHp/bf.myMax*100)+'%';
      const bossBar = document.getElementById('bossHpBar'); if(bossBar) bossBar.style.width = Math.max(0,bf.bossHp/bf.bossMax*100)+'%';
      const mt = document.getElementById('myHpTxt'); if(mt) mt.textContent = fmtHp(bf.myHp);
      const bt = document.getElementById('bossHpTxt'); if(bt) bt.textContent = fmtHp(bf.bossHp);
    });
  };
  const stepResult = ()=>{ renderBossTurnResult(bf, true); };

  const steps = [ {at:clash.totalMs, fn:stepPower}, {at:clash.totalMs+700, fn:stepHp}, {at:clash.totalMs+1600, fn:stepResult} ];
  const timers = steps.map(st=> setTimeout(()=>{ st.done = true; st.fn(); }, st.at));
  const modalEl = document.querySelector('#modalRoot .battle-modal');
  let skipped = false;
  const skipAnim = ()=>{
    if(skipped || steps[2].done) return;
    skipped = true;
    timers.forEach(clearTimeout);
    if(modalEl) modalEl.classList.add('skip');
    let d = 0;
    steps.forEach(st=>{ if(st.done) return; st.done = true; setTimeout(st.fn, d); d += 300; });
    const sb = document.getElementById('skipAnimBtn'); if(sb) sb.remove();
  };
  const skipBtn = document.getElementById('skipAnimBtn');
  if(skipBtn) skipBtn.addEventListener('click', (e)=>{ e.stopPropagation(); skipAnim(); });
  if(modalEl) modalEl.addEventListener('click', skipAnim);
}
function resolveBossFightVictory(bf, rewardBonusRate){
  checkDailyRollover();
  const i = bf.stageIdx;
  const already = state.stageBest[i];
  const isFirstClear = !already;
  const grade = bossGradeForTurns(bf.turn); // (v92) 남은 체력 대신 클리어 턴 수 기준
  const baseReward = Math.round(8 + i*0.6);
  state.essence += baseReward;
  const gradeRank = {C:1,B:2,A:3,S:4};
  if(!already || gradeRank[grade] > gradeRank[already]){
    const base = (50 + i*15) * 1.5;
    grantStageTierRewards('boss', i, base, grade, already, (1+rewardBonusRate), 0, '👑', '보스 스테이지 '+(i+1), 'stage');
    state.stageBest[i] = grade;
  }
  let bonusGranted = false;
  if(!state.bossBonusClaimed[i]){ // 첫 격파 보너스 — 격파 전에는 ???로만 보이고, 격파하면 무엇인지 공개됨 (v120)
    state.bossBonusClaimed[i] = true;
    addPendingReward('boss_'+i+'_bonus', '🎟️', '첫 격파 보너스', 0, 0, 'stage', {equip:1});
    bonusGranted = true;
  }
  state.dailyStats.stagesCleared += 1;
  checkChapterPctRewards(Math.floor(i/CHAPTER_LENGTH)+1);
  checkAchievements();
  save();
  const chapterLine = isFirstClear ? '<div style="margin-top:6px; font-weight:700; color:var(--legendary);">🏆 챕터 '+bossChapter(i)+' 클리어! 다음 챕터로 이동</div>' : '';
  return { baseReward, isFirstClear, chapterLine, grade, bonusGranted };
}

// ===================== 🧪 프로토타입: 6칸 격자 + 범위 + 라인별 스킬·패시브 + 상태 효과 (v145) =====================
// (v146) 보스가 아닌 모든 일반 스테이지에 적용. 진형은 6칸(전열 0~2 · 후열 3~5, 같은 세로줄 = idx%3).
// 상성은 "공격자 속성 vs 맞는 대상 속성". 대상은 항상 1명(어느 편이든), 모든 행동이 그 대상 기준으로 들어감.
const SKILL_ROUND_CAP = 20;
const ALLY_HP_MULT = 2.7;
const ENEMY_HP_MULT = 2.5;
const SKILL_ENEMY_STEP_MS = 750;
const SKILL_ROUND_GAP_MS = 900;
const GRID_SLOTS = 6;
const RAID_WIDTH = 4; // (v163) 레이드: 인당 전열2·후열2, 둘이 합쳐 아군 8칸(2×4열)
const RAID_ALLY_SLOTS = RAID_WIDTH*2;
const BASE_CRIT = 0.05, CRIT_MULT = 1.5;
const RARITY_SPEED = {common:0, rare:4, epic:8, legendary:14, mythic:20};
const ELEMENT_SPEED = {fire:6, water:2, wood:-4, light:4, dark:-6};
function isSkillStage(i){ return !isBossStage(i); } // (v146) 일반 스테이지 전체가 새 전투 사용
function sideWidth(sf, side){ return (sf && sf.mode==='raid' && side==='me') ? RAID_WIDTH : 3; } // (v163) 레이드는 아군 쪽만 4열(전2·후2 ×2인)로 넓어짐
function isFrontRow(idx, width){ return idx < (width||3); }
function gradeOf(rarity){ return Math.max(0, RARITY_ORDER.indexOf(rarity)); }
function speedForElementRarity(element, rarity){ return 100 + (RARITY_SPEED[rarity]||0) + (ELEMENT_SPEED[element]||0); }
// 격자 이웃: row(가로=양옆) · pierce(관통=바로 뒤) · cross(십자=양옆+뒤) — width는 한 줄의 칸 수(기본 3, 레이드 아군은 4)
function gridNeighbors(idx, shape, width){
  const w = width || 3, r = Math.floor(idx/w), c = idx%w, out = [];
  if(shape==='row' || shape==='cross'){ if(c>0) out.push(idx-1); if(c<w-1) out.push(idx+1); }
  if(shape==='pierce' || shape==='cross'){ if(r===0) out.push(idx+w); }
  return out;
}
let skillSel = { key:null, side:null, idx:null };
let skillPumpTimer = null;
let skillIntroPending = false, skillIntroUntil = 0;
let skillRenderedFx = 0;

// ---------- 유닛 ----------
function makeBattleUnit(side, idx, key, atk, hpMult, specialMult){
  const sp = SPIRITS[key], g = gradeOf(sp.rarity);
  const maxHp = Math.max(1, Math.round(atk*hpMult)); // (v146) specialMult는 공격력에만 적용, 체력에는 반영 안 함
  return { side, idx, key, element: sp.element, line: sp.element+'_'+sp.variant, g, atk, hp: maxHp, maxHp,
    cd1: 0, cd2: 0, alive: true, st: {}, reviveUsed: false, reviveGiven: false, specialMult: specialMult||1 }; // (v162) 스킬2 시작 쿨타임 2턴 제거 — 등급만 되면 바로 사용 가능
}
function enemyGridForStage(i){
  const a = stageEnemyComposition(i), b = stageEnemyComposition(i+1);
  const ra = enemyRarityCompForStage(i), rb = enemyRarityCompForStage(i+1);
  return { els: [a[0],a[1],a[2],a[3],a[4],b[0]], rv: [ra[0],ra[1],ra[2],ra[3],ra[4],rb[0]] };
}
// (v146) 특수 규칙 이식: 황금/봉인 슬롯·속성 필드 = 그 자리 공격력 배율, 순서·커버리지·인접·다양성·연쇄(+정예·자원)는 조건 충족 쪽 팀 전체 배율.
// 둘 다 dealDamage에서 공격력에만 곱해지고 체력(HP)에는 영향 없음(공격력 배율이라는 표시와 일치시키기 위함).
function specialUnitMult(spec, idx, element, elements, isPlayer){
  if(!spec) return 1;
  return specialSlotMult(spec, idx, element) * specialRuleMult(spec, elements, GRID_SLOTS, isPlayer);
}
function buildSkillStageFight(i){
  const grid = enemyGridForStage(i), per = enemySlotPower(i);
  const spec = isSpecialStage(i) ? specialStageSpec(i) : null;
  const myElements = state.formation.slice(0, GRID_SLOTS).map(k=>k && SPIRITS[k] ? SPIRITS[k].element : null);
  const enemyElements = grid.els;
  const myUnits = [];
  state.formation.slice(0, GRID_SLOTS).forEach((key, idx)=>{
    if(key && SPIRITS[key]){
      const m = specialUnitMult(spec, idx, SPIRITS[key].element, myElements, true);
      myUnits.push(makeBattleUnit('me', idx, key, unitAtk(key), ALLY_HP_MULT, m));
    }
  });
  const enemyUnits = grid.els.map((el, idx)=>{
    const rv = grid.rv[idx], key = el+'_'+rv.rarity+'_'+rv.variant;
    const m = specialUnitMult(spec, idx, el, enemyElements, false);
    return makeBattleUnit('enemy', idx, key, per*ELEMENT_ATK_MULT[el], ENEMY_HP_MULT, m);
  });
  const sf = { v:147, stageIdx: i, round: 1, phase: 'acting', queue: [], queuePos: 0, myUnits, enemyUnits,
    log: ['전투 시작!'], result: null, fxSeq: 0, lastFx: null, special: spec };
  startRoundQueue(sf);
  return sf;
}
function startSkillStageFight(i){
  if(!state.formation.slice(0, GRID_SLOTS).some(k=>k)){ toast('진형에 정령 먼저 배치'); return; }
  state.skillFight = buildSkillStageFight(i);
  skillSel.key = null;
  skillIntroPending = true;
  save();
  showSkillStageScreen();
}
function skillGradeForRounds(r){ if(r<=3) return 'S'; if(r===4) return 'A'; if(r<=6) return 'B'; return 'C'; }
function sideUnits(sf, side){ return side==='me' ? sf.myUnits : sf.enemyUnits; }
function foeOf(side){ return side==='me' ? 'enemy' : 'me'; }
function unitAt(sf, side, idx){ return sideUnits(sf, side).find(u=>u.idx===idx); }
function aliveUnits(list){ return list.filter(u=>u.alive); }
function frontFirst(list, width){ const a = aliveUnits(list), f = a.filter(u=>isFrontRow(u.idx, width)); return f.length ? f : a; }
function validEnemyTargets(sf){ return frontFirst(sf.enemyUnits, sideWidth(sf,'enemy')).map(u=>u.idx); }
function skillUnitName(side, u){ return (side==='enemy' ? '적 ' : '')+(u.dispName || SPIRITS[u.key].name); }
function skillTargetable(sf, side, idx){
  const u = unitAt(sf, side, idx);
  if(!u || !u.alive) return false;
  return side==='me' ? true : validEnemyTargets(sf).includes(idx);
}
function effSpeed(u){ const s = u.st; return speedForElementRarity(u.element, SPIRITS[u.key].rarity) + (s.haste?s.haste.v:0) - (s.slow?s.slow.v:0) - (s.chill||0); }
function pushLog(sf, line){ sf.log = (sf.log||[]).concat(line).slice(-5); }
function setFx(sf, fx){ sf.fxSeq = (sf.fxSeq||0) + 1; fx.id = sf.fxSeq; sf.lastFx = fx; }

// ---------- 피해·회복 ----------
function atkBonus(sf, a, d){
  let b = 0; const s = a.st;
  if(s.buff) b += s.buff.v;
  if(s.empower) b += s.empower;
  if(a.line==='fire_a' && a.g>=1 && a.hp/a.maxHp<=0.5) b += [0,.15,.20,.25,.30][a.g];
  if((s.shield||0)>0){ let best = 0; aliveUnits(sideUnits(sf, a.side)).forEach(u=>{ if(u.line==='light_a' && u.g>=1) best = Math.max(best, [0,.08,.10,.12,.15][u.g]); }); b += best; }
  if(a.line==='dark_a' && a.g>=1) b += (1 - d.hp/d.maxHp)*100*[0,.003,.004,.005,.006][a.g];
  return b;
}
function dmgReduction(sf, d){
  let r = 0;
  if(d.line==='wood_a' && d.g>=1) r += [0,.08,.10,.12,.15][d.g];
  { const w = sideWidth(sf, d.side); if(!isFrontRow(d.idx, w)){ const f = unitAt(sf, d.side, d.idx-w); if(f && f.alive && f.line==='wood_a' && f.g>=4) r += 0.2; } }
  return r;
}
function killUnit(sf, u){
  if(!u.alive) return; // 이미 쓰러진 유닛을 다시 처리하지 않음
  u.hp = 0; u.alive = false;
  const poisoned = u.st.poison ? u.st.poison : null;
  u.st = {};
  // 화염-a 레전더리↑: 자기 부활(신화는 부활하며 폭발)
  if(u.line==='fire_a' && u.g>=3 && !u.reviveUsed){
    u.reviveUsed = true; u.alive = true; u.hp = Math.round(u.maxHp*0.3);
    pushLog(sf, SPIRITS[u.key].name+' 부활!');
    if(u.g>=4) aliveUnits(sideUnits(sf, foeOf(u.side))).forEach(e=>dealDamage(sf, u, e, 0.8, {noCrit:true}));
    return;
  }
  // 빛-a 신화: 같은 편 쓰러진 아군 1회 부활
  const angel = aliveUnits(sideUnits(sf, u.side)).find(x=>x.line==='light_a' && x.g>=4 && !x.reviveGiven);
  if(angel){ angel.reviveGiven = true; u.alive = true; u.hp = Math.round(u.maxHp*0.5); pushLog(sf, SPIRITS[angel.key].name+'이(가) '+SPIRITS[u.key].name+' 부활'); return; }
  // 숲결-b 패시브: 독 걸린 채 쓰러지면 옆 칸으로 독 전파
  if(poisoned && poisoned.srcG>=1 && Math.random() < [0,.5,.65,.8,1][poisoned.srcG]){
    const nb = gridNeighbors(u.idx, 'row').map(i=>unitAt(sf, u.side, i)).filter(x=>x && x.alive);
    if(nb.length){ const t = nb[Math.floor(Math.random()*nb.length)]; if(!t.st.ward) t.st.poison = {r:3, pct:poisoned.pct, srcG:poisoned.srcG}; else t.st.ward--; }
  }
}
function dealDamage(sf, a, d, mult, opts){
  opts = opts || {};
  if(!d.alive) return null;
  let v = a.atk * mult * (a.specialMult||1) * typeMult(a.element, d.element) * (1 + atkBonus(sf, a, d));
  if(sf.mode==='boss'){
    const adj = bossDefenseAdjust(sf, a, d, v);
    if(adj.blocked) return { total:0, crit:false, blocked:true };
    if(adj.healBoss>0){ d.hp = Math.min(d.maxHp, d.hp + adj.healBoss); return { total:0, crit:false, healed:adj.healBoss }; }
    v = adj.v;
  }
  const s = d.st;
  v *= 1 + (s.curse ? s.curse.v : 0) + (s.web ? s.web.v : 0);
  v *= Math.max(0.1, 1 - dmgReduction(sf, d));
  let critCh = BASE_CRIT;
  if(a.line==='dark_b' && a.g>=1 && s.curse) critCh += [0,.10,.15,.20,.25][a.g];
  const crit = !opts.noCrit && Math.random() < critCh;
  if(crit) v *= CRIT_MULT;
  const total = Math.max(0, Math.round(v));
  let rest = total;
  if(s.shield>0){ const ab = Math.min(s.shield, rest); s.shield -= ab; rest -= ab; if(s.shield<=0) delete s.shield; }
  d.hp = Math.max(0, d.hp - rest);
  if(s.reflect && total>0 && a.alive && a!==d){ const rd = Math.round(total*s.reflect.v); a.hp = Math.max(0, a.hp - rd); if(a.hp<=0) killUnit(sf, a); }
  if(d.hp<=0) killUnit(sf, d);
  return { total, crit };
}
function healAmount(target, amt){
  const p = target.st.poison;
  if(p) amt *= (p.srcG>=3 ? 0 : 0.5);
  return Math.round(amt);
}
// ---------- 행동 문맥(스킬 run에 넘기는 도구) ----------
function makeActCtx(sf, a, tSide, tIdx){
  const C = { sf, a, g:a.g, tSide, t: unitAt(sf, tSide, tIdx), hits: [] };
  C.P = arr=>arr[a.g];
  C.side = s=>aliveUnits(sideUnits(sf, s));
  C.around = shape=>gridNeighbors(C.t.idx, shape, sideWidth(sf, tSide)).map(i=>unitAt(sf, tSide, i)).filter(u=>u && u.alive);
  C.hit = (u, mult)=>{
    if(!u || !u.alive) return null;
    const r = dealDamage(sf, a, u, mult);
    if(!r) return null;
    C.hits.push({ side:u.side, idx:u.idx, kind:'dmg', amount:r.total, crit:r.crit, eff:typeMult(a.element, u.element) });
    if(a.line==='water_b' && a.g>=1 && u.alive){ const v = [0,5,6,8,10][a.g]; u.st.chill = Math.min(v*3, (u.st.chill||0) + v); }
    return r;
  };
  C.heal = (u, amt)=>{ if(!u || !u.alive) return; const before = u.hp; u.hp = Math.min(u.maxHp, u.hp + healAmount(u, amt)); C.hits.push({ side:u.side, idx:u.idx, kind:'heal', amount:u.hp-before }); };
  C.shield = (u, amt)=>{ if(!u || !u.alive) return; const v = Math.round(amt); u.st.shield = (u.st.shield||0) + v; C.hits.push({ side:u.side, idx:u.idx, kind:'shield', amount:v }); };
  C.neg = (u, fn, label)=>{ if(!u || !u.alive) return false; if(u.st.ward>0){ u.st.ward--; if(!u.st.ward) delete u.st.ward; C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:'🔰막음' }); return false; } fn(u.st); C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:label }); return true; };
  C.pos = (u, fn, label)=>{ if(!u || !u.alive) return; fn(u.st); C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:label }); };
  C.burn = (u, n)=>{ const cap = (a.line==='fire_b' && a.g>=4) ? 8 : 5; C.neg(u, st=>{ st.burnCap = Math.max(cap, st.burnCap||5); st.burn = Math.min(st.burnCap, (st.burn||0)+n); st.burnDmg = Math.max(st.burnDmg||0, Math.round(a.atk*0.15)); }, '🔥화상'); };
  C.poison = (u, pct)=>{ C.neg(u, st=>{ st.poison = { r:3, pct, srcG:a.g }; }, '☠독'); };
  C.cleanse = (u, n)=>{ let k = 0; ['freeze','bind','poison','burn','curse','web','slow','chill'].forEach(key=>{ if(k<n && u.st[key]){ delete u.st[key]; if(key==='burn'){ delete u.st.burnDmg; delete u.st.burnCap; } k++; } }); };
  C.strip = u=>{ let n = 0; ['shield','haste','buff','regen','reflect','ward','taunt','empower'].forEach(key=>{ if(u.st[key]){ delete u.st[key]; n++; } }); return n; };
  C.actNext = u=>{
    if(!u.alive) return;
    const q = sf.queue;
    for(let p=q.length-1; p>sf.queuePos; p--) if(q[p].side===u.side && q[p].idx===u.idx) q.splice(p, 1);
    q.splice(sf.queuePos+1, 0, { side:u.side, idx:u.idx, speed:effSpeed(u) });
  };
  return C;
}
// 실제 행동 실행(내 정령·적 공통). act: basic | s1 | s2
function performAction(sf, a, act, tSide, tIdx){
  const C = makeActCtx(sf, a, tSide, tIdx);
  if(!C.t) return C;
  const name = SPIRITS[a.key].name;
  if(act==='basic'){
    C.hit(C.t, 1);
    if(a.line==='fire_b' && a.g>=1 && C.t.alive && Math.random() < [0,.3,.4,.5,.6][a.g]) C.burn(C.t, 1);
    pushLog(sf, (a.side==='enemy'?'적 ':'')+name+' 공격 → '+skillUnitName(tSide, C.t));
  }else{
    const sk = unitSkill(a, act);
    sk.run(C);
    if(act==='s1') a.cd1 = sk.cd; else a.cd2 = sk.cd;
    pushLog(sf, (a.side==='enemy'?'적 ':'')+name+' '+sk.name+' → '+skillUnitName(tSide, C.t));
  }
  if(a.st.empower) delete a.st.empower;
  setFx(sf, { kind:'act', actorSide:a.side, actorIdx:a.idx, hits:C.hits });
  sf.actSeq = (sf.actSeq||0) + 1; // (v165) 레이드 동기화용 행동 번호
  return C;
}

  let h = '<div class="bs-result"><div class="bs-rcard '+(r.win?'win':'lose')+'">';
  h += r.win ? '<div class="bs-ricon">🏆</div><div class="bs-rtitle">레이드 승리!</div>' : '<div class="bs-ricon">💀</div><div class="bs-rtitle">패배</div>';
  h += '<div class="bs-rsub">'+r.rounds+'라운드'+(raidNet.role==='solo'?' · 연습(보상 없음)':'')+'</div>';
  if(raidNet.rewardText) h += '<div class="bs-rrew"><div>'+raidNet.rewardText+'</div></div>';
  h += '<div class="bs-rbtns"><button class="btn" id="skillResultCloseBtn">확인</button></div></div></div>';
  return h;
}

// ---------- 전투 동기화 ----------
function afterFightMutation(){
  const sf = state.skillFight;
  if(sf && sf.mode==='raid' && raidNet.role==='host') raidHostSync();
}
function raidHostSync(){
  if(raidNet.role!=='host' || !raidNet.code || !raidNet.db || raidNet.syncQueued) return;
  raidNet.syncQueued = true;
  raidWriteChain = raidWriteChain.then(async ()=>{
    raidNet.syncQueued = false;
    const sf = state.skillFight; if(!sf || sf.mode!=='raid' || !raidNet.code) return;
    raidNet.battleSeq += 1;
    const patch = { battleJson: JSON.stringify(sf), battleSeq: raidNet.battleSeq };
    if(sf.result) patch.status = 'done';
    await raidRef().update(patch);
    raidNudge();
  }).catch(e=>{ raidNet.syncQueued = false; raidNetError(e); });
}
function raidHostApplyRemote(a){
  const sf = state.skillFight;
  if(raidNet.role!=='host' || !sf || sf.mode!=='raid' || sf.result || !a || typeof a!=='object') return;
  if(a.by!==raidPartnerUid() || a.seq!==(sf.actSeq||0)+1) return;
  if(settleQueue(sf)!=='me') return;
  const cur = sf.queue[sf.queuePos];
  if(!P2_SLOTS.includes(cur.idx) || cur.idx!==a.idx) return;
  const u = unitAt(sf, 'me', cur.idx); if(!u || !u.alive) return;
  if(!['basic','s1','s2'].includes(a.act) || !skillAvailable(u, a.act)) return;
  let tSide = a.tSide, tIdx = a.tIdx;
  if(!['me','enemy'].includes(tSide) || !Number.isInteger(tIdx) || !skillTargetable(sf, tSide, tIdx)){ const c = aiChooseAction(sf, u); if(!c) return; tSide = c.side; tIdx = c.idx; }
  clearTimeout(skillPumpTimer); skillPumpTimer = null;
  performAction(sf, u, a.act, tSide, tIdx);
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function raidGuestSubmit(act, tSide, tIdx){
  const sf = state.skillFight; if(!sf || sf.result || raidNet.role!=='guest') return;
  if(settleQueue(sf)!=='me') return;
  const cur = sf.queue[sf.queuePos]; if(!raidMine(cur.idx)) return;
  const seq = (sf.actSeq||0) + 1;
  if(raidNet.pendingSeq===seq) return;
  raidNet.pendingSeq = seq;
  raidNet.db.doc('raidActs/'+raidNet.code).set({ seq, by: raidNet.uid, idx: cur.idx, act, tSide, tIdx, round: sf.round })
    .then(()=>raidNudge())
    .catch(e=>{ raidNet.pendingSeq = 0; raidNetError(e); showSkillStageScreen(); });
  skillSel.key = null;
  showSkillStageScreen();
}
function raidGuestPump(sf){
  if(sf.result || raidNet.pendingSeq > (sf.actSeq||0)) return;
  if(settleQueue(sf)!=='me') return;
  const cur = sf.queue[sf.queuePos];
  if(!raidMine(cur.idx) || !state.skillAuto) return;
  const key = (sf.actSeq||0)+1;
  skillPumpTimer = setTimeout(()=>{
    skillPumpTimer = null;
    const s = state.skillFight; if(!s || s.mode!=='raid' || (s.actSeq||0)+1!==key || settleQueue(s)!=='me') return;
    const u = unitAt(s, 'me', s.queue[s.queuePos].idx); if(!u || !raidMine(u.idx)) return;
    const c = aiChooseAction(s, u); if(c) raidGuestSubmit(c.act, c.side, c.idx);
  }, SKILL_ENEMY_STEP_MS*skillSpeedMult());
}

// ---------- 방 문서 처리 ----------
function raidOnDoc(snap){
  if(!raidNet.code) return;
  if(!snap || !snap.exists){
    const sf = state.skillFight;
    if(sf && sf.mode==='raid' && sf.result) return; // 결과 화면 보는 중엔 방이 지워져도 그대로 둠
    raidLocalCleanup(); toast('방이 닫혔어요'); render(); return;
  }
  const d = raidCleanDoc(snap.data()); if(!d) return;
  raidNet.doc = d;
  if(raidNet.role==='guest' && d.guest!==raidNet.uid){ raidLocalCleanup(); toast('방에서 나가졌어요'); render(); return; }
  if(d.status==='closed'){ const sf = state.skillFight; if(sf && sf.mode==='raid' && sf.result) return; raidLocalCleanup(); state.skillFight = null; unmountBattleScreen(); save(); toast('레이드가 해산됐어요'); render(); return; }
  raidNameOf(raidPartnerUid());
  if(d.status==='lobby'){ showRaidLobbyModal(); return; }
  if(d.status==='pick'){
    if(raidNet.role==='host' && d.guest && d.ready[d.host] && d.ready[d.guest] && !raidNet.starting) raidHostStartBattle(d);
    else if(!raidNet.starting) showRaidPickModal();
    return;
  }
  if(!d.battleJson) return;
  if(raidNet.role==='guest'){
    if(d.battleSeq===raidNet.lastBattleSeq) return;
    const sf = raidParseBattle(d.battleJson); if(!sf) return;
    const first = !state.skillFight || state.skillFight.mode!=='raid';
    raidNet.lastBattleSeq = d.battleSeq;
    clearTimeout(skillPumpTimer); skillPumpTimer = null;
    state.skillFight = sf;
    if(raidNet.pendingSeq && (sf.actSeq||0) >= raidNet.pendingSeq) raidNet.pendingSeq = 0;
    if(sf.result) raidGrantReward(sf);
    if(first){ skillSel.key = null; skillIntroPending = true; activeTab = 'raid'; render(); }
    showSkillStageScreen();
  }else if(!state.skillFight || state.skillFight.mode!=='raid'){ // 방장이 새로고침한 뒤 이어하기
    const sf = raidParseBattle(d.battleJson); if(!sf) return;
    raidNet.battleSeq = d.battleSeq;
    state.skillFight = sf; skillSel.key = null; activeTab = 'raid'; render();
    showSkillStageScreen();
  }
}
function raidOnActDoc(snap){ if(raidNet.role==='host' && snap && snap.exists) raidHostApplyRemote(snap.data()); }
async function raidAttach(code, role){
  raidNet.code = code; raidNet.role = role; raidNet.doc = null; raidNet.battleSeq = 0; raidNet.lastBattleSeq = -1;
  raidNet.pendingSeq = 0; raidNet.starting = false; raidNet.rewardText = ''; raidNet.partnerOnline = null; raidNet.partnerOffSince = 0;
  raidNet.myPicks = [null,null,null,null]; raidNet.selSlot = 0; raidNet.picksInit = false;
  state.raidSession = { code, role }; save();
  raidNet.unsubs.push(raidRef().onSnapshot(raidOnDoc, e=>raidNetError(e)));
  if(role==='host') raidNet.unsubs.push(raidActRef().onSnapshot(raidOnActDoc, ()=>{}));
  if(raidNet.room){
    try{
      const h = await raidNet.room.join('raid-'+code.toLowerCase());
      if(raidNet.code!==code){ h.leave().catch(()=>{}); return; }
      raidNet.roomH = h;
      h.presence({ uid: raidNet.uid, role }).catch(()=>{});
      raidNet.unsubs.push(h.onPeers(ch=>{
        const pid = raidPartnerUid();
        const on = !!pid && ch.peers.some(p=>!p.isMe && (p.by===pid || (p.presence && p.presence.uid===pid)));
        if(on!==raidNet.partnerOnline){
          raidNet.partnerOnline = on; raidNet.partnerOffSince = on ? 0 : Date.now();
          raidRefreshScreen();
        }
      }, ()=>{}));
      raidNet.unsubs.push(h.on('nudge', m=>{
        if(m.sameTab) return;
        if(raidNet.role==='host') raidActRef().get().then(raidOnActDoc).catch(()=>{});
        else raidRef().get().then(raidOnDoc).catch(()=>{});
      }, ()=>{}));
    }catch(e){ raidNet.roomH = null; }
  }
  clearInterval(raidNet.tick);
  raidNet.tick = setInterval(()=>{ // 끊김 판정 시간이 지나면 해산 버튼·AI 대행이 켜지도록 화면만 다시 그림(쓰기 없음)
    if(!raidNet.code || raidNet.partnerOnline!==false) return;
    if(Date.now()-raidNet.partnerOffSince >= RAID_OFFLINE_GRACE_MS && !raidNet.graceShown){ raidNet.graceShown = true; raidRefreshScreen(); }
  }, 3000);
}
function raidLocalCleanup(){
  raidNet.unsubs.forEach(f=>{ try{ f(); }catch(e){} }); raidNet.unsubs = [];
  if(raidNet.roomH){ raidNet.roomH.leave().catch(()=>{}); raidNet.roomH = null; }
  clearInterval(raidNet.tick); raidNet.tick = null; raidNet.graceShown = false;
  const wasModal = raidNet.code && document.getElementById('raidModal');
  raidNet.code = null; raidNet.role = null; raidNet.doc = null; raidNet.pendingSeq = 0; raidNet.starting = false;
  state.raidSession = null; save();
  if(wasModal) closeModal();
}
function raidRefreshScreen(){
  if(!raidNet.code || !raidNet.doc) return;
  const s = raidNet.doc.status;
  if(s==='lobby' && document.getElementById('raidModal')) showRaidLobbyModal();
  else if(s==='pick' && document.getElementById('raidModal')) showRaidPickModal();
  else if((s==='battle' || s==='done') && state.skillFight && state.skillFight.mode==='raid' && document.getElementById('battleScreen')) showSkillStageScreen();
}

// ---------- 방 만들기 / 참가 / 나가기 ----------
function raidNewCode(){ let c = ''; for(let i=0;i<6;i++) c += RAID_CODE_CHARS[Math.floor(Math.random()*RAID_CODE_CHARS.length)]; return c; }
async function raidCreateRoom(){
  if(!raidNet.ready || raidNet.busy) return;
  raidNet.busy = true; render();
  try{
    let code = null;
    for(let t=0; t<5 && !code; t++){
      const c = raidNewCode(), ref = raidNet.db.doc('raids/'+c);
      const lease = await ref.acquire({ holder: raidNet.uid, ttlMs: 1000 }); // 짧게 — 만들자마자 들어오는 친구를 막지 않도록
      if(!lease.acquired) continue;
      const snap = await ref.get();
      const old = snap.exists ? raidCleanDoc(snap.data()) : null;
      if(old && old.status!=='closed' && Date.now()-old.createdAt < 24*3600000) continue; // 아직 쓰이는 코드
      await ref.set({ code:c, host: raidNet.uid, guest: null, status:'lobby', bossId: raidWeekBoss().id, weekKey: raidWeekKey(),
        picks:{}, ready:{}, battleJson:null, battleSeq:0, createdAt: Date.now() });
      code = c;
    }
    if(!code){ toast('방을 만들지 못했어요. 다시 시도해주세요'); return; }
    await raidAttach(code, 'host');
  }catch(e){ raidNetError(e); }
  finally{ raidNet.busy = false; render(); }
}
async function raidJoinRoom(input){
  if(!raidNet.ready || raidNet.busy) return;
  const code = String(input||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){ toast('방 코드는 6자리예요'); return; }
  raidNet.busy = true; render();
  try{
    const ref = raidNet.db.doc('raids/'+code);
    let lease = null;
    for(let t=0; t<6; t++){ // 방장이 방을 막 만든 직후거나 다른 사람이 입장 처리 중이면 잠깐 기다렸다 재시도
      lease = await ref.acquire({ holder: raidNet.uid, ttlMs: 1500 });
      if(lease.acquired) break;
      await new Promise(r=>setTimeout(r, 400));
    }
    if(!lease || !lease.acquired){ toast('다른 사람이 입장 중이에요. 잠시 후 다시 시도해주세요'); return; }
    const snap = await ref.get();
    const d = snap.exists ? raidCleanDoc(snap.data()) : null;
    if(!d || d.status==='closed' || d.status==='done'){ toast('존재하지 않는 방이에요'); return; }
    if(d.host===raidNet.uid){ await raidAttach(code, 'host'); return; }
    if(d.guest && d.guest!==raidNet.uid){ toast('방이 꽉 찼어요 (2/2)'); return; }
    if(d.status!=='lobby' && d.guest!==raidNet.uid){ toast('이미 시작된 방이에요'); return; }
    if(d.guest!==raidNet.uid) await ref.update({ guest: raidNet.uid, ready: { [raidNet.uid]: false } });
    await raidAttach(code, 'guest');
  }catch(e){ raidNetError(e); }
  finally{ raidNet.busy = false; render(); }
}
async function raidLeaveLobby(){
  const code = raidNet.code, role = raidNet.role; if(!code) return;
  const ref = raidRef();
  raidLocalCleanup(); render();
  try{
    await raidWriteChain;
    if(role==='host'){ await ref.delete(); await raidNet.db.doc('raidActs/'+code).delete(); }
    else await ref.update({ guest: null });
  }catch(e){}
}
async function raidDissolve(){
  const code = raidNet.code, role = raidNet.role; if(!code) return;
  const ref = raidRef();
  raidLocalCleanup(); state.skillFight = null; unmountBattleScreen(); save(); render();
  try{ await raidWriteChain; await ref.update({ status:'closed' }); if(role==='host') await raidNet.db.doc('raidActs/'+code).delete(); }catch(e){}
}
async function raidFinish(){ // 결과 화면 '확인'
  const code = raidNet.code, role = raidNet.role;
  raidLocalCleanup(); state.skillFight = null; unmountBattleScreen(); save(); activeTab = 'raid'; render();
  if(role==='host' && code && raidNet.db){ try{ await raidWriteChain; await raidNet.db.doc('raidActs/'+code).delete(); await raidNet.db.doc('raids/'+code).delete(); }catch(e){} }
}
async function raidResume(){
  const s = state.raidSession;
  if(!s || typeof s.code!=='string' || !['host','guest'].includes(s.role)){ state.raidSession = null; return; }
  try{
    const snap = await raidNet.db.doc('raids/'+s.code).get();
    const d = snap.exists ? raidCleanDoc(snap.data()) : null;
    if(!d || d.status==='closed' || d.status==='done' || (s.role==='host' ? d.host!==raidNet.uid : d.guest!==raidNet.uid)){ state.raidSession = null; save(); return; }
    activeTab = 'raid'; render();
    await raidAttach(s.code, s.role);
  }catch(e){ state.raidSession = null; }
}

// ---------- 시작 · 선택 ----------
function raidMyPickPayload(){ return raidNet.myPicks.map(k=> k ? { key:k, atk: Math.round(unitAtk(k)) } : null); }
function raidAutoPicks(){ return Object.keys(SPIRITS).filter(k=>ownedCount(k)>0).sort((a,c)=>unitAtk(c)-unitAtk(a)).slice(0,4); }
function raidSavePicks(){ if(raidIsNet()) raidUpdate({ picks:{ [raidNet.uid]: raidMyPickPayload() }, ready:{ [raidNet.uid]: false } }); }
async function raidHostStartBattle(d){
  raidNet.starting = true;
  const sf = buildRaidFight(d.picks[d.host], d.picks[d.guest], d.bossId);
  state.skillFight = sf; skillSel.key = null; skillIntroPending = true;
  raidNet.battleSeq = 1;
  raidUpdate({ status:'battle', battleJson: JSON.stringify(sf), battleSeq: 1 });
  activeTab = 'raid'; render();
  showSkillStageScreen();
}
function raidStartSolo(){
  raidLocalCleanup();
  raidNet.role = 'solo'; raidNet.rewardText = '';
  raidNet.myPicks = raidAutoPicks(); while(raidNet.myPicks.length<4) raidNet.myPicks.push(null);
  raidNet.selSlot = 0;
  showRaidPickModal();
}

// ---------- 온라인 연결 ----------
async function raidInitNet(){
  try{
    if(!(window.claude && typeof window.claude.use==='function')) throw new Error('no claude');
    const [db, user, room] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('room')]);
    if(!db || !user) throw new Error('no db');
    const uid = await user.id(); if(!uid) throw new Error('no uid');
    raidNet.db = db; raidNet.user = user; raidNet.room = room || null; raidNet.uid = uid; raidNet.ready = true;
    user.can('data.write').then(v=>{ raidNet.canWrite = v; if(activeTab==='raid' && !raidNet.code) render(); }).catch(()=>{});
    if(state.raidSession) await raidResume();
  }catch(e){ raidNet.failed = true; state.raidSession = null; }
  if(activeTab==='raid' && !raidNet.code) render();
}

function checkSkillStageOutcome(sf){
  if(sf.mode==='boss') return checkBossWaveOutcome(sf);
  if(sf.mode==='expedition') return checkExpeditionOutcome(sf);
  if(sf.mode==='raid') return checkRaidOutcome(sf);
  if(sf.result) return true;
  if(!aliveUnits(sf.enemyUnits).length){
    const prevBest = state.stageBest[sf.stageIdx] || null;
    sf.result = { win:true, rounds: sf.round, prevBest };
    sf.result.info = resolveSkillStageBattle(sf.stageIdx, sf.round);
    return true;
  }
  if(!aliveUnits(sf.myUnits).length){ sf.result = { win:false, rounds: sf.round }; return true; }
  return false;
}

// ---------- 행동 순서 ----------
function buildQueue(sf){
  const e = [];
  [...sf.myUnits, ...sf.enemyUnits].forEach(u=>{ if(u.alive) e.push({ side:u.side, idx:u.idx, speed:effSpeed(u), bound:!!u.st.bind }); });
  e.sort((x,y)=>{ if(x.bound!==y.bound) return x.bound?1:-1; if(y.speed!==x.speed) return y.speed-x.speed; if(x.side!==y.side) return x.side==='me'?-1:1; return x.idx-y.idx; });
  [...sf.myUnits, ...sf.enemyUnits].forEach(u=>{ if(u.st.bind) delete u.st.bind; });
  return e.map(x=>({ side:x.side, idx:x.idx, speed:x.speed }));
}
function startRoundQueue(sf){ sf.queue = buildQueue(sf); sf.queuePos = 0; sf.phase = 'acting'; }
// 지금 차례: 'me' | 'enemy' | 'end'. 쓰러진 유닛은 건너뛰고, 빙결이면 한 번 쉬게 함
function settleQueue(sf){
  while(sf.queuePos < sf.queue.length){
    const e = sf.queue[sf.queuePos], u = unitAt(sf, e.side, e.idx);
    if(u && u.alive){
      if(u.st.freeze){ delete u.st.freeze; pushLog(sf, skillUnitName(u.side, u)+' 빙결로 쉼'); sf.queuePos++; continue; }
      return e.side;
    }
    sf.queuePos++;
  }
  return 'end';
}
// 라운드 시작: 쿨다운 감소 · 지속 효과(화상·독·재생) · 지속 시간 감소 · 패시브(맑은 물·서약)
function roundStartEffects(sf){
  if(sf.mode==='boss') applyBossGimmick(sf);
  if(sf.mode==='raid') applyRaidGimmicks(sf);
  const hits = [];
  const all = [...sf.myUnits, ...sf.enemyUnits];
  all.forEach(u=>{
    if(!u.alive) return;
    u.cd1 = Math.max(0, u.cd1-1); u.cd2 = Math.max(0, u.cd2-1);
    const s = u.st;
    let loss = 0;
    if(s.burn){ loss += s.burn * (s.burnDmg||0); }
    if(s.poison){ loss += Math.round(u.maxHp * s.poison.pct); }
    if(loss>0){ u.hp = Math.max(0, u.hp - loss); hits.push({ side:u.side, idx:u.idx, kind:'dmg', amount:loss, dot:true }); if(u.hp<=0){ killUnit(sf, u); return; } }
    if(s.regen){ const b = u.hp; u.hp = Math.min(u.maxHp, u.hp + healAmount(u, u.maxHp*s.regen.v)); if(u.hp>b) hits.push({ side:u.side, idx:u.idx, kind:'heal', amount:u.hp-b }); }
    ['slow','haste','curse','web','buff','regen','reflect'].forEach(k=>{ if(s[k]){ s[k].r--; if(s[k].r<=0) delete s[k]; } });
    if(s.poison){ s.poison.r--; if(s.poison.r<=0) delete s.poison; }
    if(s.taunt){ s.taunt--; if(s.taunt<=0) delete s.taunt; }
  });
  ['me','enemy'].forEach(side=>{
    const list = aliveUnits(sideUnits(sf, side));
    list.forEach(p=>{
      if(p.line==='water_a' && p.g>=1 && list.length){
        const low = aliveUnits(sideUnits(sf, side)).reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
        const b = low.hp; low.hp = Math.min(low.maxHp, low.hp + healAmount(low, low.maxHp*[0,.03,.04,.05,.06][p.g]));
        if(low.hp>b) hits.push({ side, idx:low.idx, kind:'heal', amount:low.hp-b });
      }
      if(p.line==='light_b' && p.g>=1){
        const slow = aliveUnits(sideUnits(sf, side)).reduce((x,y)=> effSpeed(y) < effSpeed(x) ? y : x);
        slow.st.haste = { v: Math.max(slow.st.haste ? slow.st.haste.v : 0, [0,5,6,8,10][p.g]), r: 1 };
      }
    });
  });
  return hits;
}

// ---------- 적 AI ----------
function aiPickFoeTarget(sf, a){
  const foe = foeOf(a.side);
  const pool = frontFirst(sideUnits(sf, foe), sideWidth(sf, foe));
  const taunt = pool.filter(u=>u.st.taunt);
  const list = taunt.length ? taunt : pool;
  if(!list.length) return null;
  return list.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
}
function aiChooseAction(sf, a){
  const kit = kitOf(a), own = aliveUnits(sideUnits(sf, a.side));
  for(const act of ['s2','s1','basic']){
    if(!skillAvailable(a, act)) continue;
    const sk = act==='basic' ? null : kit[act];
    const kind = sk ? sk.kind : 'harm';
    if(kind==='harm'){
      const t = aiPickFoeTarget(sf, a); if(!t) return null;
      if(a.line==='dark_a' && act==='s2' && t.hp/t.maxHp>0.3) continue; // 처형은 막타용
      if(a.line==='fire_b' && act==='s2' && !(t.st.burn>0)) continue;   // 발화는 화상이 있을 때만
      if(a.line==='dark_b' && act==='s2' && !['shield','haste','buff','regen','reflect','ward','taunt'].some(k=>t.st[k])) continue;
      return { act, side:t.side, idx:t.idx };
    }
    if(kind==='heal'){
      const low = own.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
      if(low.hp/low.maxHp < 0.7) return { act, side:a.side, idx:low.idx };
      continue;
    }
    // 보호막·강화: 전열 우선, 체력 낮은 아군 / 강화는 공격력 높은 아군
    const front = own.filter(u=>isFrontRow(u.idx, sideWidth(sf, a.side)));
    const pool = front.length ? front : own;
    const t = kind==='buff' ? own.reduce((x,y)=> y.atk>x.atk ? y : x) : pool.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
    return { act, side:a.side, idx:t.idx };
  }
  return null;
}

// ---------- 진행 ----------
function recommendEnemyTarget(sf, a){
  let best = null, bestScore = -Infinity;
  validEnemyTargets(sf).forEach(idx=>{
    const d = unitAt(sf, 'enemy', idx), tm = typeMult(a.element, d.element);
    const est = a.atk * tm;
    const score = (est >= d.hp + (d.st.shield||0) ? 1000 : 0) + tm*100 - d.hp/d.maxHp*10;
    if(score > bestScore){ bestScore = score; best = idx; }
  });
  return best;
}
function ensureSkillSelection(sf, a){
  const key = sf.stageIdx+':'+sf.round+':'+sf.queuePos;
  if(skillSel.key !== key || !skillTargetable(sf, skillSel.side, skillSel.idx)) skillSel = { key, side:'enemy', idx: recommendEnemyTarget(sf, a) };
}
function myTurnAction(act){
  const sf = state.skillFight; if(!sf || sf.result) return;
  if(settleQueue(sf)!=='me') return;
  const a = unitAt(sf, 'me', sf.queue[sf.queuePos].idx); if(!a || !a.alive) return;
  if(!skillAvailable(a, act)) return;
  ensureSkillSelection(sf, a);
  if(!skillTargetable(sf, skillSel.side, skillSel.idx)) return;
  if(sf.mode==='raid'){
    if(!raidMine(a.idx)) return; // 팀원 정령은 팀원만 조작
    if(raidNet.role==='guest'){ raidGuestSubmit(act, skillSel.side, skillSel.idx); return; }
  }
  performAction(sf, a, act, skillSel.side, skillSel.idx);
  skillSel.key = null;
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function stepEnemyTurn(){
  const sf = state.skillFight; if(!sf || sf.result) return;
  if(settleQueue(sf)!=='enemy'){ showSkillStageScreen(); return; }
  const a = unitAt(sf, 'enemy', sf.queue[sf.queuePos].idx);
  const c = aiChooseAction(sf, a);
  if(c) performAction(sf, a, c.act, c.side, c.idx);
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function nextSkillRound(){
  const sf = state.skillFight; if(!sf || sf.result) return;
  sf.round += 1;
  pushLog(sf, '라운드 '+sf.round);
  const hits = roundStartEffects(sf);
  setFx(sf, { kind:'round', round: sf.round, hits });
  if(!checkSkillStageOutcome(sf)) startRoundQueue(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
// (v147) 자동전투: 내 턴도 AI가 대신 행동. 2배속: 대기 시간 절반
function skillSpeedMult(){ return state.skillSpeed2x ? 0.5 : 1; }
function stepMyAutoTurn(){
  const sf = state.skillFight; if(!sf || sf.result) return;
  if(settleQueue(sf)!=='me') return;
  const a = unitAt(sf, 'me', sf.queue[sf.queuePos].idx);
  if(a && a.alive){ const c = aiChooseAction(sf, a); if(c) performAction(sf, a, c.act, c.side, c.idx); }
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function pumpSkillFight(){
  const sf = state.skillFight;
  if(!sf || sf.result || skillPumpTimer || !document.getElementById('battleScreen')) return;
  if(sf.mode==='raid' && raidNet.role==='guest'){ raidGuestPump(sf); return; } // 팀원 화면은 판정하지 않고 방장 상태만 받아 그림
  const next = settleQueue(sf);
  const wait = Math.max(0, skillIntroUntil - Date.now());
  if(next==='me'){
    if(sf.mode==='raid' && !raidMine(sf.queue[sf.queuePos].idx)){ // 팀원 차례: 입력 대기(끊겼으면 AI가 대신)
      if(raidPartnerGone()) skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; stepMyAutoTurn(); }, wait + SKILL_ENEMY_STEP_MS*skillSpeedMult());
      return;
    }
    if(!state.skillAuto) return;
    skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; stepMyAutoTurn(); }, wait + SKILL_ENEMY_STEP_MS*skillSpeedMult());
    return;
  }
  if(next==='enemy'){ skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; stepEnemyTurn(); }, wait + SKILL_ENEMY_STEP_MS*skillSpeedMult()); return; }
  if(sf.round >= SKILL_ROUND_CAP){ sf.result = { win:false, rounds: sf.round, timeout:true }; if(sf.mode==='raid') raidGrantReward(sf); save(); showSkillStageScreen(); afterFightMutation(); return; }
  sf.phase = 'roundEnd';
  skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; nextSkillRound(); }, wait + SKILL_ROUND_GAP_MS*skillSpeedMult());
}
function endSkillStageFight(){
  clearTimeout(skillPumpTimer); skillPumpTimer = null;
  state.skillFight = null; skillSel.key = null; save();
  unmountBattleScreen();
}
function restartSkillStageFight(){ const sf = state.skillFight; if(!sf) return; const i = sf.stageIdx; endSkillStageFight(); startSkillStageFight(i); }
// ---------- 예상 결과: 복사본에서 실제로 실행해 보고 차이를 요약(크리티컬 제외) ----------
function skillPreview(sf, a, act, tSide, tIdx){
  const c = JSON.parse(JSON.stringify(sf)), rnd = Math.random;
  Math.random = ()=>0.999;
  let C;
  try{ C = performAction(c, unitAt(c, a.side, a.idx), act, tSide, tIdx); } finally { Math.random = rnd; }
  const t0 = unitAt(sf, tSide, tIdx), t1 = unitAt(c, tSide, tIdx);
  const dmg = C.hits.filter(h=>h.kind==='dmg' && h.side===tSide && h.idx===tIdx).reduce((x,h)=>x+h.amount, 0);
  const heal = C.hits.filter(h=>h.kind==='heal' && h.side===tSide && h.idx===tIdx).reduce((x,h)=>x+h.amount, 0);
  const shield = C.hits.filter(h=>h.kind==='shield' && h.side===tSide && h.idx===tIdx).reduce((x,h)=>x+h.amount, 0);
  const others = new Set(C.hits.filter(h=>!(h.side===tSide && h.idx===tIdx) && !(h.side===a.side && h.idx===a.idx)).map(h=>h.side+h.idx)).size;
  const parts = [];
  if(dmg) parts.push(dmg+' 피해');
  if(heal) parts.push('+'+heal+' 회복');
  if(shield) parts.push('🛡'+shield);
  if(!parts.length){ const st = C.hits.find(h=>h.kind==='status' && h.side===tSide && h.idx===tIdx); if(st) parts.push(st.text); }
  if(others) parts.push('+'+others+'명');
  const kill = !!(t0 && t0.alive && t1 && !t1.alive);
  return { text: parts.join(' · ') || '효과 없음', kill, dmg };

function kitOf(u){ return LINE_KITS[u.line]; }
function unitSkill(u, act){ return act==='basic' ? null : kitOf(u)[act]; }
function skillAvailable(u, act){ if(act==='basic') return true; if(act==='s2' && u.g<2) return false; return (act==='s1'?u.cd1:u.cd2)<=0; }
function resolveSkillStageBattle(i, rounds){
  const grade = skillGradeForRounds(rounds);
  const already = state.stageBest[i];
  const gradeRank = {C:1,B:2,A:3,S:4};
  const baseReward = Math.round(5 + i*0.4);
  state.essence += baseReward;
  let improved = false, reward = 0;
  if(!already || gradeRank[grade] > gradeRank[already]){
    improved = true;
    const base = 50 + i*15;
    reward = grantStageTierRewards('stage', i, base, grade, already, 1, 0, '🗺️', '스테이지 '+(i+1), 'stage');
    state.stageBest[i] = grade;
  }
  state.dailyStats.stagesCleared += 1;
  checkChapterPctRewards(Math.floor(i/CHAPTER_LENGTH)+1);
  checkAchievements();
  save();
  return { grade, improved, reward, baseReward };
}

  ruinGuardian:{name:'유적파수꾼', icon:'🗿', desc:'서로 다른 속성의 결계석 2개가 살아있는 동안 보스 무적 — 결계석부터 파괴해야 함'},
  abyssCrystal:{name:'심연의 수정', icon:'🔮', desc:'매 라운드 속성이 바뀜 · 다음 라운드 속성이 미리 표시됨'}
